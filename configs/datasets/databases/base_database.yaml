dbname: 'local' # or 'staging' or 'prod' for remote databases. local is for local postgres database.
dotenv_path: ${paths.dotenv_path}
cdf_threshold_channel_localizations: null
channel_count: null
min_channel_count: null
max_channel_count: null
required_channel_key_patterns: null
any_channel_patterns: null
all_channel_patterns: null
required_channel_localizations: null # required localizations that must all be present in channel_mapping and define the allowed loader subset universe

verbose: true # to print debug messages
diagnostic_verbose: false # run slow channel-mapping diagnostic query (can take 100s+ on large tables)
protocol: cursor # protocol used to fetch data from source (default is 'binary', can also be 'csv' or 'cursor')
sample_type: null
node_local_store_root: ${oc.env:NODE_LOCAL_STORE_ROOT}
node_local_table_keys: {}
required_locations: null
holdout_split: null