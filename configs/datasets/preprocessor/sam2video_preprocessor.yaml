name: sam2_video

with_masking: true
mask_generator: null
dtype: ${quantization}

transforms_list:
#   # 1) Resize to Z=128, Y=256, X=512
#   - _target_: cell_observatory_platform.data.transforms.resize.Resize
#     input_format: ${dataset_layout_order}          # e.g. "ZYXC"
#     target_spatial_shape: [128, 256, 512]         # (Z, Y, X)
#     mode: trilinear
#     align_corners: false
#     dtype: ${quantization}
#     bbox_format: ${datasets.preprocessor.bbox_output_format}
#     crop_to_meta_spatial: true

#   # 2) Normalize after resize
  - _target_: cell_observatory_platform.data.transforms.normalize.Normalize
    input_layout:
      _target_: cell_observatory_platform.data.data_shapes.MULTICHANNEL_HYPERCUBE
      value: ${dataset_layout_order}

patch_shape: ${datasets.patch_shape}
input_format: ${dataset_layout_order}
input_shape: ${datasets.input_shape}

seed: ${seed}

# debug_savepath: null
expect_mask_channel: true # ${datasets.collate_fn.expect_mask_channel}
require_targets: true #${datasets.collate_fn.require_targets}
max_masks: 40 # 38 on single-gpu, 35 on multi-gpu
# Boxes as the collator emits them (format + normalization); the target view
# denormalizes to voxels once so the box-prompt sampler sees real coordinates.
bbox_format: ${datasets.collate_fn.bbox_output_format}
boxes_normalized: ${datasets.collate_fn.normalize_bboxes}
# Channel-token ids for the channel-adaptive patch embed (models.backbones.masked_encoder
# patch_embed_type: channel_adaptive). null -> no ids are emitted. Set by data/channel_vocab.py
# at dataloader construction (same table the encoder sizes its embeddings from).
channel_vocab: null
unknown_policy: error # error | unk: a token missing from the vocab at TRAIN time (inference always maps to <unk>)
unk_token_p: 0.0 # training only: replace each (channel, kind) id by <unk> with this probability so the
                 # <unk> rows are trained; an unseen token at inference then lands on a fitted embedding
