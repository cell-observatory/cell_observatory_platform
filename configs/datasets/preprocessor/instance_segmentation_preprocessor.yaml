name: instance_segmentation

with_masking: false
mask_generator: null
dtype: ${quantization}

transforms_list: []
#   # 1) Resize to Z=128, Y=256, X=512
#   - _target_: cell_observatory_platform.data.transforms.resize.Resize
#     input_format: ${dataset_layout_order}          # e.g. "ZYXC"
#     target_spatial_shape: [128, 256, 512]         # (Z, Y, X)
#     mode: trilinear
#     align_corners: false
#     dtype: ${quantization}
#     bbox_format: ${datasets.preprocessor.bbox_output_format}
#     crop_to_meta_spatial: true

#   # 2) Normalize after resize
#   - _target_: cell_observatory_platform.data.transforms.normalize.Normalize
#     input_layout:
#       _target_: cell_observatory_platform.data.data_shapes.MULTICHANNEL_HYPERCUBE
#       value: ${dataset_layout_order}

patch_shape: ${datasets.patch_shape}
input_format: ${dataset_layout_order}
input_shape: ${datasets.input_shape}
mask_channel_idx: ${datasets.mask_channel_idx}

seed: ${seed}

bbox_data_format: zyxzyx
bbox_output_format: cxcyczwhd

# debug_savepath: null
require_targets: true #${datasets.collate_fn.require_targets}

# When true, the preprocessor materializes per-instance binary masks
# (targets[b]["masks"]) on-device from the integer label_map. Leave false
# for labelmap-native heads (MaskDINO reads targets[b]["label_map"]) and for
# PlainDETR (no mask loss). Only set true for a head whose matcher/loss reads
# dense targets[b]["masks"] and is wired to THIS preprocessor. (Mask2Former
# training uses the semantic-segmentation preprocessor, not this one.)
materialize_binary_masks: false