name: semantic_segmentation

# Class taxonomy. "all" = every matched semantic_segmentation_* channel role, which is
# what you want when the DB supplies the classes directly (membrane, cytosol, golgi...).
# Give an explicit ordered list to select named slices instead -- e.g. the membrane-only
# setup here, where the two derived maps are the classes and the raw source channel is
# just their input.
# Class index is list position, so this also fixes the label values.
semantic_classes: [boundary, foreground]

with_masking: false
mask_generator: null
dtype: ${quantization}

transforms_list:
  # # 1) Resize to Z=128, Y=256, X=512
  # - _target_: cell_observatory_platform.data.transforms.resize.Resize
  #   input_format: ${dataset_layout_order}          # e.g. "ZYXC"
  #   target_spatial_shape: [128, 256, 512]         # (Z, Y, X)
  #   mode: trilinear
  #   align_corners: false
  #   dtype: ${quantization}
  #   bbox_format: ${datasets.preprocessor.bbox_output_format}
  #   crop_to_meta_spatial: true

  # 1) Convert the membrane instance labelmap to boundary masks
  - _target_: cell_observatory_platform.data.transforms.make_targets.InstanceToBoundaryMask
    source_role: semantic_segmentation_membrane
    connectivity: 1

  # 2) Convert the membrane instance labelmap to foreground masks
  - _target_: cell_observatory_platform.data.transforms.make_targets.ForegroundMasks
    source_role: semantic_segmentation_membrane
    remove_boundary: true

  # 2) Normalize after transforms
  - _target_: cell_observatory_platform.data.transforms.normalize.Normalize
    input_layout:
      _target_: cell_observatory_platform.data.data_shapes.MULTICHANNEL_HYPERCUBE
      value: ${dataset_layout_order}

patch_shape: ${datasets.patch_shape}
input_format: ${dataset_layout_order}
input_shape: ${datasets.input_shape}

seed: ${seed}