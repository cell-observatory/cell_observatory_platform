metadata: false # (img & zern) else (amps, photons, counts, peak2peak, umRMS, npoints, avg_min_distance, filename)
lls_defocus: false
defocus_only: false

iotf: null
return_dataloader: true
samplelimit: null
collate_fn: null
dtype: fp16