defaults:
  - _self_

collate_fn:
  _target_: cell_observatory_platform.data.masking.mask_generator.MaskCollator
  base_collator: cell_observatory_platform.data.datasets.pretrain_dataset.collate_pretrain_dataset
  mask_generators:
    - _target_: cell_observatory_platform.data.masking.mask_generator.MaskGenerator
      layout: ${datasets.dataset.layout}
      input_shape: ${datasets.input_shape}
      patch_shape: ${datasets.patch_shape}

      lateral_mask_scale: 0.5
      axial_mask_scale: 0.5
      temporal_mask_scale: 0.5

      aspect_ratio_scale_hw: 0.5
      random_masking_ratio: 0.7
      num_blocks: 2

      channels_to_mask: null
      time_downsample_pattern: null
      mask_mode: 
        _target_: cell_observatory_platform.data.masking.mask_generator.MaskModes
        value: "random"