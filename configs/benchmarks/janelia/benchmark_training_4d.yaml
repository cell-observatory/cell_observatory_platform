# @package _global_

# TODO: make an example/template multi-run config

# specify multi_run for launching several training jobs
run_type: multi_run

# NOTE (IMPORTANT): 
# We have two ways of grouping keeping tabs of training jobs that may later be compared:
# 1. all jobs will have same rootdir with prefix given by 
#    `name` field in each run config
# 2. wandb_tags to group runs together in the wandb dashboard
#    and use their hparam features to compare runs 

wandb_tags: [ "benchmark", "benchmark_training_infra", "scaling", "h200", "mae_large"]
data_base_dir: training_infrastructure/training_mae_4d

# NOTE: make sure to include .yaml suffix to naming of config files! These names are appended to configs/experiments/
#       and written to disk for reproducibility and to be passed to runner.py

# NOTE: defaults_overrides is a list of configs that will be merged into the run config
#       before applying the run overrides. This is useful for setting defaults to something different
#      than the global defaults, e.g. for a specific dataloader or model.

runs:
  - cfg: benchmarks/janelia/benchmark_training_base
    name: 1gpus_8cores_h200_mae_large.yaml
    defaults_overrides:
      - clusters: clusters/janelia_h200
      - models: models/mae/mae_large
    overrides:
     clusters:
       worker_nodes: 1
       gpus_per_worker: 1
       cpus_per_gpu: 8
       batch_size: 64
     datasets:
       databases:
         max_rois: null # maximum number of ROIs (each ROI can have dozens of tiles)
         max_tiles: null # maximum number of tiles (each tile can have thousands of hypercubes)
         max_hypercubes: 250 # maximum number of hypercubes to return
         use_cached_hypercubes_dataframe: true
         hypercubes_dataframe_path: ${paths.workdir}/databases/test_hypercubes_dataframe.csv
         protocol: cursor # protocol used to fetch data from source (default is 'binary', can also be 'csv' or 'cursor')

  - cfg: benchmarks/janelia/benchmark_training_base
    name: 1gpus_12cores_h200_mae_large.yaml
    defaults_overrides:
      - clusters: clusters/janelia_h200
      - models: models/mae/mae_large
    overrides:
     clusters:
       worker_nodes: 1
       gpus_per_worker: 1
       cpus_per_gpu: 12
       batch_size: 64
     datasets:
       databases:
         max_rois: null # maximum number of ROIs (each ROI can have dozens of tiles)
         max_tiles: null # maximum number of tiles (each tile can have thousands of hypercubes)
         max_hypercubes: 250 # maximum number of hypercubes to return
         use_cached_hypercubes_dataframe: true
         hypercubes_dataframe_path: ${paths.workdir}/databases/test_hypercubes_dataframe.csv
         protocol: cursor # protocol used to fetch data from source (default is 'binary', can also be 'csv' or 'cursor')

  - cfg: benchmarks/janelia/benchmark_training_base
    name: 8gpus_8cores_h200_mae_large.yaml
    defaults_overrides:
      - clusters: clusters/janelia_h200
      - models: models/mae/mae_large
    overrides:
      clusters:
        worker_nodes: 1
        gpus_per_worker: 8
        cpus_per_gpu: 8
        batch_size: 512
      datasets:
        databases:
          max_rois: null # maximum number of ROIs (each ROI can have dozens of tiles)
          max_tiles: null # maximum number of tiles (each tile can have thousands of hypercubes)
          max_hypercubes: 2000 # maximum number of hypercubes to return
          use_cached_hypercubes_dataframe: true
          hypercubes_dataframe_path: ${paths.workdir}/databases/test_hypercubes_dataframe.csv
          protocol: cursor # protocol used to fetch data from source (default is 'binary', can also be 'csv' or 'cursor')

  - cfg: benchmarks/janelia/benchmark_training_base
    name: 8gpus_12cores_h200_mae_large.yaml
    defaults_overrides:
      - clusters: clusters/janelia_h200
      - models: models/mae/mae_large
    overrides:
      clusters:
        worker_nodes: 1
        gpus_per_worker: 8
        cpus_per_gpu: 12
        batch_size: 512
      datasets:
        databases:
          max_rois: null # maximum number of ROIs (each ROI can have dozens of tiles)
          max_tiles: null # maximum number of tiles (each tile can have thousands of hypercubes)
          max_hypercubes: 2000 # maximum number of hypercubes to return
          use_cached_hypercubes_dataframe: true
          hypercubes_dataframe_path: ${paths.workdir}/databases/test_hypercubes_dataframe.csv
          protocol: cursor # protocol used to fetch data from source (default is 'binary', can also be 'csv' or 'cursor')
