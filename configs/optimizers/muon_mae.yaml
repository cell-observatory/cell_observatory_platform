name: muon
lr: 5e-4 # initial learning rate
wd: 5e-5 # initial weight decay
clip_grad: 0.5
betas: [0.9, 0.99]
eps: 1e-08
adjust_lr_fn: match_rms_adamw

get_param_groups_extra:
  enc_layer_decay: 1.0 # default no layer decay; use 0.75 for MAE-style decay
  dec_layer_decay: 1.0 # default no layer decay
