inferencer_worker:
  name: inferencer_worker
  aggregate_mode: "none"
  inference_mode: "tile"
  task: semantic_segmentation
  # Configures which tensors get passed to the viz / save workers
  outputs_metadata:
    tensor_info:
      data_tensor:
        shape: ${datasets.input_shape}
        dtype: ${dataset_dtype}
        # Declares the image as a DENSE viz tensor (rendered in the processed frame,
        # same as the predictions, so overlays align).
        kind: dense
        data_format: ${dataset_layout_order}
    buffer_tensors:
      - pred_masks
      - data_tensor
      - masks_labelmap
    visualize_tensors:
      - pred_masks
      # - pred_scores
      - pred_classes
      - data_tensor
      - masks_labelmap
      # - pred_boxes
    save_tensors:
      masks_labelmap:
        name: semantic_masks
        dtype: ${storage_dtype}
        annotation_type: dense
        data_format: ZYXC
      # class_labels was dropped from Mask2Former outputs (duplicate of
      # pred_classes) -- consumers read pred_classes.
      pred_classes:
        name: labels
        dtype: ${storage_dtype}
        annotation_type: sparse
        data_format: N
 
  # Data shape configuration
  input_format: ${dataset_layout_order}
  input_shape: ${datasets.input_shape}
  patch_shape: ${datasets.patch_shape}

  # Toggle viz / save workers
  save_outputs: true
  block_on_save: false
  vizualize_outputs: true
  block_on_viz: false

save_worker:
  max_workers: 2
  save_mode: "create"
  shard_spatial_shape: [128, 128, 128]
  chunk_spatial_shape: [32, 32, 32]

viz_worker:
  max_workers: 2
  output_dir: ${paths.outdir}/visualizations
  # Configures what visualization handlers to use
  handler_configs:
    # instance_overlay:
