    #   gt_boxes_format: cxcyczwhd
    #   z_step: 10
    #   pmin: 1.0
    #   pmax: 99.0
    #   scale_gt_boxes: true
    #   input_format: ZYXC
    #   ortho: true

    # feature_viz:
    #   gt_key: data_tensor
    #   # Must match a key in model predictions (MaskDINO: masks, boxes, labels, scores)
    #   feat_key: masks
    #   z_step_pdf: 10
    #   pmin: 1.0
    #   pmax: 99.0
    #   fit: per_t
    #   sample_voxels: 50000
    #   viz: pca

    # save_predictions:
    #   save_tensors: ["pred_masks"]
    #   z_step_pdf: 10
    #   pmin: 1.0
    #   pmax: 99.0

    semantic_map:
      z_step_pdf: 10
      pmin: 1.0
      pmax: 99.0
      mip_depth: 1
      class_names: ["boundary", "interior"]
