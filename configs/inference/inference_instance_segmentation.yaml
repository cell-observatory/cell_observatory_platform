inferencer_worker:
  _target_: cell_observatory_platform.inference.inferencer.InferencerWorker
  aggregate_mode: "none"
  inference_mode: "tile"
  task: instance_segmentation
  # Required when save_outputs is true: root zarr channel index -> name for data you write.
  channel_names:
    0: membrane
  # Configures which tensors get passed to the viz / save workers
  outputs_metadata:
    buffer_tensors:
      - masks
    visualize_tensors:
      - masks
      # - scores
      - labels
      - boxes
    save_tensors:
      masks:
        name: instance_masks
        dtype: ${storage_dtype}
        annotation_type: dense
        data_format: ZYXC
      # scores:
      #   name: scores
      #   dtype: ${dataset_dtype}
      #   annotation_type: sparse
      #   data_format: N
      labels:
        name: labels
        dtype: ${dataset_dtype}
        annotation_type: sparse
        data_format: N
      boxes:
        name: boxes
        dtype: ${dataset_dtype}
        annotation_type: sparse
        data_format: N6

  # Data shape configuration
  input_format: ${dataset_layout_order}
  input_shape: ${datasets.input_shape}
  patch_shape: ${datasets.patch_shape}
  decoder_head_type: "maskdino"

  # Toggle viz / save workers
  save_outputs: true
  block_on_save: false
  vizualize_outputs: true
  block_on_viz: false

  # InferencerWorker expects a single mapping: { name, tile_names } or { name, fraction }.
  # by_tile: only tiles listed get visualization (saves GPU / disk). Set to null to visualize every batch.
  viz_sampling_policy:
    name: by_tile
    tile_names:
      - "000x_000y_000z.zarr"


save_worker:
  max_workers: 2
  save_mode: "overwrite"
  shard_spatial_shape: [128, 128, 128]
  chunk_spatial_shape: [32, 32, 32]

viz_worker:
  max_workers: 2
  output_dir: ${paths.outdir}/visualizations
  # Configures what visualization handlers to use
  handler_configs:
    instance_overlay:
      pred_boxes_format: xyzxyz
      gt_boxes_format: cxcyczwhd
      z_step: 10
      pmin: 1.0
      pmax: 99.0
      scale_gt_boxes: true
      input_format: ZYXC
      ortho: true

    feature_viz:
      gt_key: data_tensor
      # Must match a key in model predictions (MaskDINO: masks, boxes, labels, scores)
      feat_key: masks
      z_step_pdf: 10
      pmin: 1.0
      pmax: 99.0
      fit: per_t
      sample_voxels: 50000
      viz: pca

    save_predictions:
      save_as_volume: false
      save_as_pdf: true
      z_step_pdf: 10
      filetype: "tiff"
      # zarr_chunk_spatial_shape: [32, 32, 32]
      # zarr_shard_spatial_shape: [128, 128, 128]
      pmin: 1.0
      pmax: 99.0



