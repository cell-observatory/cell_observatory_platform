inferencer_worker:
  name: inferencer_worker
  aggregate_mode: "none"
  inference_mode: "tile"
  task: instance_segmentation
  # Configures which tensors get passed to the viz / save workers
  outputs_metadata:
    # data_tensor is the model INPUT volume: the configured viz handlers
    # (instance_overlay / feature_viz) read record.image, so it must ride a
    # shared-memory viz pool like every other viz tensor (the plasma fallback
    # was removed; InferencerWorker validates this at startup). Model-produced
    # tensor_info entries are merged in at runtime; data_tensor is not a model
    # output, so its shape/dtype are declared here.
    tensor_info:
      data_tensor:
        shape: ${datasets.input_shape}
        dtype: ${dataset_dtype}
        # Declares the image as a DENSE viz tensor (rendered in the processed frame,
        # same as the predictions, so overlays align).
        kind: dense
        data_format: ${dataset_layout_order}
    buffer_tensors:
      - masks
      - data_tensor
    visualize_tensors:
      - masks
      # - scores
      - labels
      - boxes
      - data_tensor
    save_tensors:
      masks:
        name: instance_masks
        dtype: ${storage_dtype}
        annotation_type: dense
        data_format: ZYXC
      # scores:
      #   name: scores
      #   dtype: ${dataset_dtype}
      #   annotation_type: sparse
      #   data_format: N
      labels:
        name: labels
        dtype: ${dataset_dtype}
        annotation_type: sparse
        data_format: N
      boxes:
        name: boxes
        dtype: ${dataset_dtype}
        annotation_type: sparse
        data_format: N6

  # Data shape configuration
  input_format: ${dataset_layout_order}
  input_shape: ${datasets.input_shape}
  patch_shape: ${datasets.patch_shape}

  # Toggle viz / save workers
  save_outputs: true
  block_on_save: false
  vizualize_outputs: true
  block_on_viz: false

  # InferencerWorker expects a single mapping: { name, tile_names and/or rois } or { name, fraction }.
  # by_tile: allowlist filter (saves GPU / disk). Set tile_names (tile filter), rois
  # (prepared_id ROI filter), or both (that tile within those ROIs) -- a sample must pass
  # every filter that is set. Set the whole policy to null to visualize every batch.
  viz_sampling_policy:
    name: by_tile
    tile_names:
      - "000x_000y_000z.zarr"
    # rois: [3, 17]


save_worker:
  max_workers: 2
  save_mode: "overwrite"
  shard_spatial_shape: [128, 128, 128]
  chunk_spatial_shape: [32, 32, 32]

viz_worker:
  max_workers: 2
  output_dir: ${paths.outdir}/visualizations
  # Configures what visualization handlers to use
  handler_configs:
    instance_overlay:
      pred_boxes_format: xyzxyz
      gt_boxes_format: cxcyczwhd
      z_step: 10
      pmin: 1.0
      pmax: 99.0
      scale_gt_boxes: true
      input_format: ZYXC
      ortho: true

    feature_viz:
      gt_key: data_tensor
      # Must match a key in model predictions (MaskDINO: masks, boxes, labels, scores)
      feat_key: masks
      z_step_pdf: 10
      pmin: 1.0
      pmax: 99.0
      fit: per_t
      sample_voxels: 50000
      viz: pca

    save_predictions:
      save_tensors: ["masks"]
      z_step_pdf: 10
      pmin: 1.0
      pmax: 99.0



