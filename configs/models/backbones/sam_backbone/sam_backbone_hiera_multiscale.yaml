# Hiera large multiscale backbone for SAM; 3 scales with q_pool=2
# backbone_native_channels: Hiera large final stage = 144 * 2^3 = 1152 (dim_mul at each stage boundary)
name: sam

# Every level is projected to backbone_embed_dims[-1]; SAM2's mask decoder
# (conv_s0/conv_s1) and memory attention are built at sam_embed_dim, so the
# per-level width must equal it.
backbone_embed_dims:
  - ${models.meta_arch.sam.sam_embed_dim}
  - ${models.meta_arch.sam.sam_embed_dim}
  - ${models.meta_arch.sam.sam_embed_dim}
# large_multiscale uses channel_proj_type=equalization: each level arrives at
# multiscale_out_dim wide, which sizes the wrapper's LayerNorms and projection.
backbone_native_channels: ${models.backbones.masked_hiera_encoder.multiscale_out_dim}
use_sam_channel_projection: true
train_backbone: true
use_layernorm: true
blocks_to_train: null
out_layers: null
adapter_out_layers: null
backbone_args: ${models.backbones.masked_hiera_encoder}
adapter_args: null
backbone_output_format: feature_map
input_shape: ${datasets.train_shape}
patch_shape: ${datasets.patch_shape}
input_format: ${dataset_layout_order}
position_encoding_type: sincos
