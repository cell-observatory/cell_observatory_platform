# Hiera large multiscale backbone for SAM; 3 scales with q_pool=2
# backbone_native_channels: Hiera large final stage = 144 * 2^3 = 1152 (dim_mul at each stage boundary)
BUILD: cell_observatory_platform.models.backbones.sam_backbone.BUILD

backbone_embed_dims:
  - 256
  - 256
  - 256
backbone_native_channels: 1152
use_sam_channel_projection: true
train_backbone: true
use_layernorm: true
blocks_to_train: null
out_layers: null
adapter_out_layers: null
backbone_args: ${models.backbones.masked_hiera_encoder}
adapter_args: null
backbone_output_format: feature_map
input_shape: ${datasets.train_shape}
patch_shape: ${datasets.patch_shape}
input_format: ${dataset_layout_order}
position_encoding_type: sincos
