BUILD: cell_observatory_platform.models.backbones.maskedencoder.BUILD

input_fmt: ${dataset_layout_order}
input_shape: ${datasets.train_shape}
patch_shape: ${datasets.patch_shape}

embed_dim: 768
depth: 12
num_heads: 16
mlp_ratio: 4.0

proj_drop_rate: 0.0
att_drop_rate: 0.0
drop_path_rate: 0.0
init_std: 0.02
fixed_dropout_depth: false
norm_layer: RmsNorm
act_layer: SiLU
mlp_layer: SwiGLU

abs_sincos_enc: true
rope_pos_enc: false
rope_random_rotation_per_head: true
rope_mixed: false
rope_theta: 100.0
weight_init_type: mae
mlp_wide_silu: false

out_layers: null