# @package models
model: mae

meta_arch:
  mae:
    input_fmt: ${dataset_layout_order}
    input_shape: ${datasets.train_shape}
    patch_shape: ${datasets.patch_shape}

    embed_dim: 1280
    # decoder_embed_dim: 512
    depth: 32
    # decoder_depth: 8
    num_heads: 16
    # decoder_num_heads: 8
    mlp_ratio: 4.0

    proj_drop_rate: 0.0
    att_drop_rate: 0.0
    drop_path_rate: 0.1
    init_std: 0.02
    fixed_dropout_depth: false
    # use_conv_proj: false
    norm_layer: RmsNorm
    act_layer: SiLU
    mlp_layer: SwiGLU

    # mask_ratio: 0.75
    # window_mask_shape: null

    abs_sincos_enc: true
    rope_pos_enc: false
    rope_random_rotation_per_head: true
    rope_mixed: false
    rope_theta: 100.0
    weight_init_type: mae
    mlp_wide_silu: false
    loss_fn: l2_masked

    out_layers: null

    # How the C signal channels enter the ViT.
    #   joint            one nn.Linear over the flattened C x patch (C baked into the weight)
    #   channel_adaptive per-channel patch tokens + token embedding (localization + fluorophore),
    #                    fused per patch (attn_pool: same token count as joint; concat: C x tokens)
    patch_embed_type: joint
    patch_embed_args: null
    # channel_adaptive example:
    # patch_embed_args:
    #   channel_fusion: attn_pool          # attn_pool | concat
    #   attn_pool_num_heads: 8
    #   channel_embed: factorized          # none | localization | fluorophore | factorized
    #   channel_vocab: null                # null -> derived from api.roi_channels at startup and frozen
    #                                      # into the checkpoint; or a table / path to channel_vocab.json
    #   vocab_extra_slots: 16              # spare embedding rows so appended tokens need no resize
