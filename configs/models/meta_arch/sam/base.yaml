BUILD: cell_observatory_platform.models.meta_arch.sam.BUILD

# 1) Image encoder (backbone wrapper)
backbone_wrapper_args: ${models.backbones.sam_backbone}
adapter_args: null

sam_embed_dim: 384

# 2) Memory attention (MemoryAttention) — dim matches backbone output (projector out dim when use_sam_channel_projection)
memory_attention_args:
  d_model: ${models.meta_arch.sam.sam_embed_dim}
  num_heads: 8
  num_layers: 1
  dim_feedforward: 2048
  dropout: 0.0
  activation: GELU
  pos_enc_at_input: false
  pos_enc_at_attn: true
  pos_enc_at_cross_attn_queries: true
  pos_enc_at_cross_attn_keys: true
  batch_first: true
  input_fmt: ${dataset_layout_order}
  input_shape: ${datasets.train_shape}
  patch_shape: ${datasets.patch_shape}
  rope_theta: 10.0
  self_attn_downsample_rate: 1
  cross_attn_qkv_bias: true
  cross_attn_qk_norm: false
  cross_attn_att_drop: 0.0
  cross_attn_proj_drop: 0.0

# 3) Memory encoder (MemoryEncoder) — position_encoding built in BUILD from out_dim
# out_dim/in_dim/mask_embed_dim must be divisible by 3 for 3D sincos PE (Z/Y/X split)
memory_encoder_args:
  input_fmt: ${dataset_layout_order}
  out_dim: 384
  in_dim: ${models.meta_arch.sam.sam_embed_dim} 
  mask_embed_dim: 384
  mask_kernel_size: 4
  mask_stride: 4
  mask_padding: 0
  mask_total_stride: 16
  fuser_num_layers: 1
  fuser_input_projection: false

# 4) SAM prompt encoder (PromptEncoder) — embed_dim, mask_in_chans popped in BUILD
# embed_dim must be even for PositionEmbeddingRandom
prompt_encoder_args:

  embed_dim: ${models.meta_arch.sam.sam_embed_dim}
  mask_in_chans: 16

# 5) SAM mask decoder (MaskDecoder) — transformer_* and iou_* popped in BUILD
mask_decoder_args:
  transformer_dim: ${models.meta_arch.sam.sam_embed_dim}
  transformer_depth: 2
  transformer_num_heads: 8
  transformer_mlp_dim: 2048
  num_multimask_outputs: 1
  iou_head_depth: 3
  iou_head_hidden_dim: 384

# 6) Criterion
criterion_args:
  BUILD: cell_observatory_platform.training.losses.MultiStepMultiMasksAndIousLoss
  input_fmt: ${dataset_layout_order}
  weight_dict:
    loss_mask: 1.0
    loss_dice: 1.0
    loss_iou: 1.0
    loss_class: 0.0
  focal_alpha: 0.25
  focal_gamma: 2
  supervise_all_iou: false
  iou_use_l1_loss: false
  pred_obj_scores: false

# SAM2 scalar / flags (passed to SAM2 ctor)
input_fmt: ${dataset_layout_order}
input_shape: ${datasets.train_shape}
patch_shape: ${datasets.patch_shape}
mask_downsample_factor: 4
use_high_res_features_in_sam: false
iou_prediction_use_sigmoid: false
pred_obj_scores: false
pred_obj_scores_mlp: false
use_multimask_token_for_obj_ptr: false
