BUILD: cell_observatory_platform.models.meta_arch.sam.BUILD

# Image encoder (backbone wrapper)
backbone_wrapper_args: ${models.backbones.sam_backbone}
adapter_args: null

sam_embed_dim: 384

# Memory attention (MemoryAttention) — dim matches backbone output (projector out dim when use_sam_channel_projection)
memory_attention_args:
  d_model: ${models.meta_arch.sam.sam_embed_dim}

  num_heads: 1
  num_layers: 4
  dim_feedforward: 2048
  dropout: 0.1
  activation: relu

  # SAM2 reference: pos enc at input, not inside attn
  pos_enc_at_input: true
  pos_enc_at_attn: false
  # SAM2 reference: cross-attn adds pos enc on keys, not queries
  pos_enc_at_cross_attn_queries: false
  pos_enc_at_cross_attn_keys: true

  batch_first: true
  input_fmt: ${dataset_layout_order}
  input_shape: ${datasets.train_shape}
  patch_shape: ${datasets.patch_shape}

  rope_theta: 10000.0

  self_attn_downsample_rate: 1
  cross_attn_qkv_bias: true
  cross_attn_qk_norm: false
  cross_attn_att_drop: 0.1
  cross_attn_proj_drop: 0.1

# Memory encoder (MemoryEncoder) — position_encoding built in BUILD from out_dim
# out_dim/in_dim/mask_embed_dim must be divisible by 3 for 3D sincos PE (Z/Y/X split)
memory_encoder_args:
  input_fmt: ${dataset_layout_order}
  out_dim: ${models.meta_arch.sam.sam_embed_dim}
  in_dim: ${models.meta_arch.sam.sam_embed_dim}
  mask_embed_dim: ${models.meta_arch.sam.sam_embed_dim}
  mask_kernel_size: 4
  mask_stride: 4
  mask_padding: 0
  mask_total_stride: 16
  mask_activation: GELU
  fuser_num_layers: 2
  fuser_input_projection: false
  fuser_dim: null
  fuser_layer_kernel_size: 7
  fuser_layer_padding: 3
  fuser_layer_drop_path: 0.0
  fuser_layer_scale_init_value: 1e-6
  fuser_layer_use_dwconv: true

# SAM prompt encoder (PromptEncoder) — embed_dim, mask_in_chans popped in BUILD
prompt_encoder_args:
  embed_dim: ${models.meta_arch.sam.sam_embed_dim}
  mask_in_chans: 16
  activation: GELU

# SAM mask decoder (MaskDecoder) — transformer_* and iou_* popped in BUILD
mask_decoder_args:
  transformer_dim: ${models.meta_arch.sam.sam_embed_dim}
  transformer_depth: 2
  transformer_num_heads: 8
  transformer_mlp_dim: 2048
  num_multimask_outputs: 1
  iou_head_depth: 3
  iou_head_hidden_dim: ${models.meta_arch.sam.sam_embed_dim}
  transformer_activation: ReLU
  transformer_attention_downsample_rate: 2
  activation: GELU
  dynamic_multimask_via_stability: false
  dynamic_multimask_stability_delta: 0.05
  dynamic_multimask_stability_thresh: 0.98

criterion_args:
  BUILD: cell_observatory_platform.training.losses.MultiStepMultiMasksAndIousLoss
  input_fmt: ${dataset_layout_order}
  weight_dict:
    loss_mask: 20.0
    loss_dice: 1.0
    loss_iou: 1.0
    loss_class: 0.0
  focal_alpha: 0.25
  focal_gamma: 2
  supervise_all_iou: true
  iou_use_l1_loss: true
  pred_obj_scores: false
  activation_checkpoint: true
  # dont see that big vram savings from point sampling
  # due to iou loss
  use_point_sampling: false
  num_points: 20000
  oversample_ratio: 3
  importance_sample_ratio: 0.75
  focal_gamma_obj_score: 0.0
  focal_alpha_obj_score: -1

input_fmt: ${dataset_layout_order}
input_shape: ${datasets.train_shape}
patch_shape: ${datasets.patch_shape}
mask_downsample_factor: 4

# for single-frame tasks we dont use mask input as output
use_mask_input_as_output_without_sam: false
directly_add_no_mem_embed: true

# currently dont use high-res features
use_high_res_features_in_sam: false

# multimask output not relevant for our prediction task
multimask_output_in_sam: false
multimask_output_for_tracking: false
multimask_min_pt_num: 1
multimask_max_pt_num: 1
use_multimask_token_for_obj_ptr: false

# not relevant for non-video tasks
# only relevant when `use_obj_ptrs_in_encoder=True`
use_obj_ptrs_in_encoder: false
add_tpos_enc_to_obj_ptrs: false
proj_tpos_enc_in_obj_ptrs: false
use_signed_tpos_enc_to_obj_ptrs: false
only_obj_ptrs_in_the_past_for_eval: false
use_mlp_for_obj_ptr_proj: false
max_obj_ptrs_in_encoder: 0

iou_prediction_use_sigmoid: true

# dont use object scores
pred_obj_scores: false
pred_obj_scores_mlp: false
fixed_no_obj_ptr: false
no_obj_embed_spatial: false
soft_no_obj_ptr: false

# no memory encoder for single frame tasks
disable_memory_encoder: true
sigmoid_scale_for_mem_enc: 20.0
sigmoid_bias_for_mem_enc: -10.0
num_maskmem: 0 # num_maskmem: 7

# SAM2Base scalars
binarize_mask_from_pts_for_mem_enc: false
# max_cond_frames_in_attn: -1
max_cond_frames_in_attn: 0 # not relevant for single frame tasks
memory_temporal_stride_for_eval: 1
non_overlap_masks_for_mem_enc: false

# SAM2 scalars (point sampling, conditioning frames, etc.)
# FIXME: breaks with prob_to_use_pt_for_train<1.0
prob_to_use_pt_input_for_train: 1.0 # 0.5 for SAM2 config
prob_to_use_pt_input_for_eval: 1.0
# prob_to_use_box_input_for_train: 0.5
prob_to_use_box_input_for_train: 0.0 # 0.5 for SAM2 config
prob_to_use_box_input_for_eval: 0.0
num_frames_to_correct_for_train: 1 # 2 for SAM2 config
num_frames_to_correct_for_eval: 1
rand_frames_to_correct_for_train: true
rand_frames_to_correct_for_eval: false
num_init_cond_frames_for_train: 1 # 2 for SAM2 config
num_init_cond_frames_for_eval: 1
# only relevant if num_init_cond_frames > 1
rand_init_cond_frames_for_train: true
rand_init_cond_frames_for_eval: false
add_all_frames_to_correct_as_cond: false
num_correction_pt_per_frame: 7
pt_sampling_for_eval: center
prob_to_sample_from_gt_for_train: 0.1
use_act_ckpt_iterative_pt_sampling: false
forward_backbone_per_frame_for_eval: true

freeze_image_encoder: false