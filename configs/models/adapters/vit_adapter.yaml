name: vit_adapter
input_format: ${dataset_layout_order}
input_shape: ${datasets.train_shape}
patch_shape: ${datasets.patch_shape}
input_channels: ${tasks.input_channels}
dtype: ${quantization}
dim: 3
backbone_embed_dim: ${models.backbones.masked_encoder.embed_dim}
num_backbone_features: 4
add_vit_feature: true
conv_inplane: 64
use_deform_attention: false
n_points: 4
n_levels: 1
deform_num_heads: 16
drop_path_rate: 0.3
init_values: 0.0
with_cffn: true
cffn_ratio: 0.5
deform_ratio: 0.5
use_extra_extractor: true
strategy: axial
spatial_prior_module_strides:
  stem1: [2, 2, 2]
  stem2: [1, 1, 1]
  stem3: [1, 1, 1]
  maxpool: 2
  stage2: [2, 2, 2]
  stage3: [2, 2, 2]
  stage4: [2, 2, 2]