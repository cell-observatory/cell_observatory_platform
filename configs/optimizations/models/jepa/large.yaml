activation_checkpoint:
  enable: false
  modules:
    - ["input_encoder.encoder", "transformer_blocks"]
    - ["target_predictor.encoder", "transformer_blocks"]
  selective_ac_option: 2
  per_op_sac_force_recompute_mm_shapes_by_fqns: null
  mode: "selective"
  mm_recompute_frac: 2

torch_compile:
  enable: false
  modules:
    - ["input_encoder.encoder", "transformer_blocks"]
    - ["target_predictor.encoder", "transformer_blocks"]
  range: block_based
  mode: null
  dynamic: false
  blockbased_fullgraph: false
  enable_compiled_autograd: false
  backend: inductor
# per-block fully_shard groups for TorchNativeTrainer (FSDP2); includes the
# frozen target_encoder (EMA copy) so its params are sharded too — its blocks
# are deliberately absent from the AC/compile lists above (runs under no_grad)
fsdp:
  modules:
    - ["input_encoder.encoder", "transformer_blocks"]
    - ["target_predictor.encoder", "transformer_blocks"]
    - ["target_encoder.encoder", "transformer_blocks"]
