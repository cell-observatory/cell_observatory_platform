val_begin: 0
val_interval: 1
val_metric: "nrmse"
val_mode: min # 'min' or 'max'

evaluator:
  name: reconstruction
  metric_reductions:
    - name: nrmse
      reduce_method: mean
    - name: mae
      reduce_method: mean
  # evaluate_step returns {task: patch_space_pred}; select the tensor by task key.
  # Both pred and metainfo["targets"] are in patchified token space, so NRMSE/MAE
  # compare element-wise directly (no unpatchify needed).
  pred_key: "channel_split"
  target_key: "targets"