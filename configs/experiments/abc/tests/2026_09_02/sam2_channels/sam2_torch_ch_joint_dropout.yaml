# @package _global_
# A0 + ChannelDropout p 0.25 (membrane always kept).
# 128^3 cubes (cod_20260902), ViT-L single-scale, torch-native; 128 seeded rows, 16 steps.
defaults:
  - /experiments/abc/tests/2026_09_01/sam2/base_sam2_torch
  - _self_

experiment_name: sam2_abc_torch_ch_joint_dropout

datasets:
  max_rows: 128
  row_sample_seed: 42
  preprocessor:
    transforms_list:
      - _target_: cell_observatory_platform.data.transforms.normalize.Normalize
        input_layout:
          _target_: cell_observatory_platform.data.data_shapes.MULTICHANNEL_HYPERCUBE
          value: ${dataset_layout_order}
      - _target_: cell_observatory_platform.data.transforms.channel_dropout.ChannelDropout
        p: 0.25
        always_keep: [membrane] # by token (metainfo channel_tokens), not position
        shuffle: false
        seed: ${seed}

