# @package _global_
# A1 + ChannelDropout p 0.25 with shuffle: channel_ids must follow the permuted data.
# 128^3 cubes (cod_20260902), ViT-L single-scale, torch-native; 128 seeded rows, 16 steps.
defaults:
  - /experiments/abc/tests/2026_09_01/sam2/base_sam2_torch
  - _self_

experiment_name: sam2_abc_torch_ch_adaptive_attnpool_factorized_dropout_shuffle

datasets:
  max_rows: 128
  row_sample_seed: 42
  preprocessor:
    transforms_list:
      - _target_: cell_observatory_platform.data.transforms.normalize.Normalize
        input_layout:
          _target_: cell_observatory_platform.data.data_shapes.MULTICHANNEL_HYPERCUBE
          value: ${dataset_layout_order}
      - _target_: cell_observatory_platform.data.transforms.channel_dropout.ChannelDropout
        p: 0.25
        always_keep: [membrane] # by token (metainfo channel_tokens), not position
        shuffle: true
        seed: ${seed}

models:
  backbones:
    masked_encoder:
      patch_embed_type: channel_adaptive
      patch_embed_args:
        channel_fusion: attn_pool
        attn_pool_num_heads: 8
        channel_embed: factorized
        channel_vocab: null # derived from api.roi_channels at dataloader construction
        vocab_extra_slots: 16
