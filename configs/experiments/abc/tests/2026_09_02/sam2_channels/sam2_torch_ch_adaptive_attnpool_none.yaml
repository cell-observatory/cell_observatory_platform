# @package _global_
# A1 variant: per-channel tokens with NO channel embedding (attn_pool over anonymous channel tokens).
# 128^3 cubes (cod_20260902), ViT-L single-scale, torch-native; 128 seeded rows, 16 steps.
defaults:
  - /experiments/abc/tests/2026_09_01/sam2/base_sam2_torch
  - _self_

experiment_name: sam2_abc_torch_ch_adaptive_attnpool_none

datasets:
  max_rows: 128
  row_sample_seed: 42

models:
  backbones:
    masked_encoder:
      patch_embed_type: channel_adaptive
      patch_embed_args:
        channel_fusion: attn_pool # attn_pool | concat
        attn_pool_num_heads: 8
        channel_embed: none # none | localization | fluorophore | factorized
        channel_vocab: null # derived from api.roi_channels at dataloader construction, written to <outdir>/channel_vocab.json
        vocab_extra_slots: 16

