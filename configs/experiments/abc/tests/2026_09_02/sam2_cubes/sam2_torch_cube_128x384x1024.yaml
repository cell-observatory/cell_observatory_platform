# @package _global_
# cod_20260902 snapshot: 128x384x1024 cubes (annotated after Martin's 2026-09-02 refresh),
# ViT-L single-scale, torch-native. Cube mode pins the buffer to input_shape, so
# only the shape, the mask budget and the point-loss sample count change vs the
# 128^3 base. max_masks is deliberately low (A100-80GB, sanity run).
defaults:
  - /experiments/abc/tests/2026_09_01/sam2/base_sam2_torch
  - _self_

experiment_name: sam2_abc_torch_single_cube_128x384x1024

datasets:
  train_shape: [1, 128, 384, 1024, 5]
  input_shape: [1, 128, 384, 1024, 6]
  max_rows: 128
  row_sample_seed: 42 # seeded subset instead of the first 128 rows of the first tile
  databases:
    # cod_20260902: ~half of the 384-wide cubes overflow their 512-wide tiles
    # (DB grid bug, reported); train on the in-bounds ones.
    in_bounds_only: true
  preprocessor:
    max_masks: 6

models:
  meta_arch:
    sam:
      criterion_args:
        num_points: 79000 # ~10% of the stride-4 grid (32x96x256)

hooks:
  hooks_list:
  - name: free_device_buffer
  - name: lr_scheduler
    backend: TORCHTITAN
  - name: iteration_timer
  - name: periodic_writer
  - name: periodic_checkpointer
    file_prefix: latest_model
    backend: TORCHTITAN
    time_interval: 3h30m
  - name: torch_memory_stats
    step_period: 1
    epoch_period: 1
    logdir: ${loggers.logdir}
