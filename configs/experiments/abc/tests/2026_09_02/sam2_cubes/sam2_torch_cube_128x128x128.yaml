# @package _global_
# 128^3 anchor on the cod_20260902 snapshot: same as sam2_torch_cube_single, run
# first to check the forward-path fixes (B2/B7/B8/B9) against the 2026-09-01
# loss (0.278 after 16 steps) before the larger shapes.
defaults:
  - /experiments/abc/tests/2026_09_01/sam2/base_sam2_torch
  - _self_

experiment_name: sam2_abc_torch_single_cube_128x128x128_snapshot0902

hooks:
  hooks_list:
  - name: free_device_buffer
  - name: lr_scheduler
    backend: TORCHTITAN
  - name: iteration_timer
  - name: periodic_writer
  - name: periodic_checkpointer
    file_prefix: latest_model
    backend: TORCHTITAN
    time_interval: 3h30m
  - name: torch_memory_stats
    step_period: 1
    epoch_period: 1
    logdir: ${loggers.logdir}
