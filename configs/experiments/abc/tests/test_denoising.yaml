# @package _global_
defaults:
  - /tasks/denoising
  - /paths/abc                               # configs/paths/abc.yaml
  - /hydra/overrides                         # configs/hydra/overrides.yaml (not working)
  - /clusters/local                          # configs/clusters/local.yaml
  - /datasets/pretrain_dataset_ray           # configs/datasets/pretrain_dataset.yaml
  - /datasets/preprocessor/denoising_preprocessor  # configs/datasets/preprocessor/denoising_preprocessor.yaml
  # - /datasets/masking/mask_generator         # configs/datasets/masking/mask_generator.yaml
  - /models/BUILD_AutoBench                  # configs/models/BUILD_AutoBench.yaml
  - /models/meta_arch/autobench/DenoisingAutoBench/mae_large  # configs/models/meta_arch/autobench/DenoisingAutoBench/mae_large.yaml
  - /models/backbones/masked_encoder/large              # configs/models/backbones/masked_encoder/large.yaml
  # - /models/heads/maskedpredictor/large                  # configs/models/decoders/linear.yaml
  - /models/heads/linear/linear
  - /hooks/hooks                             # configs/hooks/hooks.yaml
  - /checkpoint/checkpoint                   # configs/checkpoint/checkpoint.yaml
  - /loggers/loggers                         # configs/loggers/loggers.yaml
  - /evaluation/base_evaluator               # configs/evaluation/base_evaluator.yaml
  - /deepspeed/zero2                         # configs/deepspeed/zero2.yaml
  # - /optimizers/lamb                         # configs/optimizers/lamb.yaml
  - /optimizers/adam                        # configs/optimizers/adamw.yaml (lamb requires CUDA JIT which fails on this GPU)
  - /schedulers/test_warmup_cosine_decay     # configs/schedulers/test_warmup_cosine_decay.yaml
  - /optimizations/models/mae                  # configs/optimizations/models/mae.yaml
  - /optimizations/optimizations             # configs/optimizations/optimizations.yaml
  - /profiling/profiling                      # configs/profiling/profiling.yaml
  - _self_

# experiment name (used for logging)
experiment_name: test_denoising_vit
wandb_project: testing

# Debug mode
# debug_mode: true
debug_mode: false

# task
task: denoising

# Model type
network: mae

backend: DEEPSPEED

# engine type
engine: deepspeed

# distributed framework
distributed_framework: ray

# run type
run_type: single_run # single_run, multi_run, or tune

# job type
job_type: train # train or test

# trainer type
trainer: cell_observatory_platform.training.loops.EpochBasedTrainer

# loop per worker script
loop_per_worker_script: cell_observatory_platform.training.loops.train_loop_per_worker

# training quantization
quantization: bfloat16 # data type for training, options: float32, float16

# NOTE: numpy doesn't support bfloat16, the preprocessor will cast data before we feed it to the model
dataset_dtype: float16 # data type for loading data, options: float32, float16
storage_dtype: uint16

# dataset layout in the zarr files
dataset_layout_order: ZYXC

# seed
seed: 42

# overrides
# --------------------------------------------------------------------------------

# clusters
clusters:
  batch_size: 12 # total batch size
  # batch_size: 12 # total batch size
  worker_nodes: 1 # number of worker nodes
  # gpus_per_worker: 1 # number of gpus per worker node
  gpus_per_worker: 4 # number of gpus per worker node
  cpus_per_gpu: 12 # number of cpu cores per gpu
  mem_per_cpu: 16000 # ram per cpu core
  ray_queue_memory: 0.2

#paths:
paths:
  # base output directory for logs, checkpoints, etc.
  outdir: ${paths.data_path}/pretrained_models/${experiment_name}
  resume_checkpointdir: null 
  pretrained_checkpointdir: null

# data
datasets:

  # Preprocessor
  preprocessor:
    transforms_list:
      # # 0) Synthetic data needs to be convolved with PSF to simulate the effect of the microscope.
      # - _target_: cell_observatory_platform.data.transforms.psf.ConvolveWithPSF
      # # TODO: Make this configurable.
      #   input_format: ${dataset_layout_order}
      #   input_shape: ${datasets.input_shape}
      #   input_pixel_size_um: [0.1, 0.1, 0.1]
      #   psf: /clusterfs/nvme/martinalvarez/psf-real/DSR/CamA_Arc_OMW.tif
      #   psf_pixel_size_um: [0.1, 0.1, 0.1]
      #   psf_format: ZYX
      #   psf_centered: true
      #   pad_type: reflect
      #   # visualization_dir: ${paths.outdir}/visualizations/psf_convolution_transform

    # 1) DeepCopyInputsAsTargets to create targets from inputs
      - _target_: cell_observatory_platform.data.transforms.make_targets.DeepCopyInputsAsTargets

    # 2) MixedPoissonGaussianNoise to add noise to inputs (inplace)
      - _target_: cell_observatory_platform.data.transforms.noise.MixedPoissonGaussianNoise
        quantum_efficiency: ${tasks.quantum_efficiency}
        electrons_per_count: ${tasks.electrons_per_count}
        sigma_background_noise: ${tasks.sigma_background_noise}
        mean_background_offset: ${tasks.mean_background_offset}
        seed: ${seed}
        # visualization_dir: ${paths.outdir}/visualizations/mixed_poisson_gaussian_noise_transform

    # 3) Normalize to normalize the data
      - _target_: cell_observatory_platform.data.transforms.normalize.Normalize
        input_layout:
          _target_: cell_observatory_platform.data.data_shapes.MULTICHANNEL_HYPERCUBE
          value: ${dataset_layout_order}

  # mainly used by other configs but determined here for ease of access
  batch_size: ${clusters.batch_size_per_gpu} # batch size = (total_batch_size * total_gpus)
  train_shape: [128, 256, 512, 1]
  input_shape: [128, 256, 512, 2]
  patch_shape: [16, 16, 16, null]
  occupancy_threshold: 0.9

  split: 0.0
  return_dataloader: true
  distributed_sampler: true

  buffer_capacity: 16
  num_actors_min: 4
  num_actors_max: 12

  max_hypercubes: 100
  max_rois: null # maximum number of ROIs (each ROI can have dozens of tiles)
  max_tiles: null # maximum number of tiles (each tile can have thousands of hypercubes)

  use_cached_hypercubes_dataframe: true
  hypercubes_dataframe_path: /clusterfs/nvme/hph/git_managed/databases/new_prepared_16_128_128_128_2_hypercube_view.csv

  synthetic_only: true
  has_annotations: true

  databases:
    occupancy_threshold_filter_type: 'min_ch0'
    synthetic_only: true
    has_annotations: true
    server_folder_path: /clusterfs/vast/forsynthetic/benchmark_tests/data/synthetic_data_iteration_1
    with_hypercubes_dataframe: true
    mask_channel: 1

  collate_fn:
    _target_: cell_observatory_platform.data.datasets.pretrain_dataset_ray.FinetuneCollatorActor
    dtype: ${dataset_dtype}
    buffer_dtype: ${storage_dtype}
    batch_size: ${clusters.batch_size_per_gpu}
    input_shape: ${datasets.input_shape}
    device_buffer_capacity: 2
    pin_numa_node: ${datasets.pin_numa_node}
    pin_pages: ${datasets.pin_memory}
    use_masks: true
    transforms_list: null
    bbox_data_format: zyxzyx
    bbox_output_format: cxcyczwhd
    with_resize: false
    debug: false
    debug_device_idx: 0
    normalize_bboxes: true
    async_device_copy: false
    columns:
      - "x_start"
      - "y_start"
      - "z_start"
      - "time_start"
      - "channel_size"
      - "z_size"
      - "y_size"
      - "x_size"
      - "time_size"
      - "server_folder"
      - "output_folder"
      - "tile_name"
      - "prepared_id"
      - "mask_bbox_dict"


# schedulers
schedulers:
  # epochs: 2
  epochs: 50

# hooks
hooks:
  hooks_list:
  - _target_: cell_observatory_platform.training.hooks.WeightDecayScheduleHook
  - _target_: cell_observatory_platform.training.hooks.FreeDeviceBufferHook
  - _target_: cell_observatory_platform.training.hooks.AnomalyDetector
  - _target_: cell_observatory_platform.training.hooks.LRScheduler
  - _target_: cell_observatory_platform.training.hooks.IterationTimer
  - _target_: cell_observatory_platform.training.hooks.PeriodicWriter
  - _target_: cell_observatory_platform.training.hooks.TorchMemoryStats
    step_period: 1
    epoch_period: 1
    logdir: ${loggers.logdir}
  - _target_: cell_observatory_platform.training.hooks.BestMetricSaver
    metric_name: ${evaluation.val_metric}
    compare_fn: ${evaluation.val_mode}
    eval_after_validation: true