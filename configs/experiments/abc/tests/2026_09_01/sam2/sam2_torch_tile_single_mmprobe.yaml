# @package _global_
# Probe: how many masks per sample fit at 128x384x1024 (tile mode, ViT-L single
# scale, torch-native) on an A100-80GB. Memory-stats + perf hooks on; max_masks
# is the knob swept between attempts.
defaults:
  - sam2_torch_tile_single
  - _self_

experiment_name: sam2_abc_torch_single_tile_128x384x1024_mmprobe_mm${datasets.preprocessor.max_masks}

datasets:
  preprocessor:
    max_masks: 10

trainer_loop:
  with_perf_metrics: true

hooks:
  hooks_list:
  - name: free_device_buffer
  - name: lr_scheduler
    backend: TORCHTITAN
  - name: iteration_timer
  - name: periodic_writer
  - name: periodic_checkpointer
    file_prefix: latest_model
    backend: TORCHTITAN
    time_interval: 3h30m
  - name: torch_memory_stats
    step_period: 1
    epoch_period: 1
    logdir: ${loggers.logdir}
