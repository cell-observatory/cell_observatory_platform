# @package _global_
# Permutation: deepspeed backend, TILE mode resized to 128x384x1024, Hiera-L multiscale.
defaults:
  - base_sam2_deepspeed_multiscale
  - _self_

experiment_name: sam2_abc_deepspeed_multi_tile_128x384x1024

datasets:
  train_shape: [1, 128, 384, 1024, 5]
  input_shape: [1, 128, 384, 1024, 6] # post-Resize model input; patch grid 8x24x64 at 16^3

  databases:
    sample_type: tile # api.tiles_training: synthetic tiles are 128 x 512 x {2560,2816,3328}

  preprocessor:
    max_masks: 12 # A100-80GB: 26 was proven at 128x384x512; this volume is 2x, so ~half
    transforms_list:
      # 1) Resize the (valid region of the) tile to input_shape. The collator
      #    buffer is the dataset max (1x128x512x3328x6); the preprocessor must
      #    land on datasets.input_shape (_assert_input_shape_spatial).
      - _target_: cell_observatory_platform.data.transforms.resize.Resize
        target_spatial_shape: [128, 384, 1024] # (Z, Y, X) == input_shape spatial
        mode: trilinear
        align_corners: false
        dtype: ${quantization}
        bbox_format: ${datasets.collate_fn.bbox_output_format}
        boxes_normalized: ${datasets.collate_fn.normalize_bboxes}
        crop_to_valid: true
      # 2) Normalize after resize (sam2video_preprocessor default).
      - _target_: cell_observatory_platform.data.transforms.normalize.Normalize
        input_layout:
          _target_: cell_observatory_platform.data.data_shapes.MULTICHANNEL_HYPERCUBE
          value: ${dataset_layout_order}
