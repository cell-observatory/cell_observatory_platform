# @package _global_
# Feature: wall-clock checkpoint trigger every 2 min (exercises the timer path within a sanity run); more rows so the run outlives the interval.
defaults:
  - base_sam2_torch
  - _self_

experiment_name: sam2_abc_torch_single_cube_128_timer2m

datasets:
  max_rows: 1024

hooks:
  hooks_list:
  - name: free_device_buffer
  - name: lr_scheduler
    backend: TORCHTITAN
  - name: iteration_timer
  - name: periodic_writer
  - name: periodic_checkpointer
    file_prefix: latest_model
    backend: TORCHTITAN
    time_interval: 2m # trainer-init -> end is ~4-5 min here (dataloader init ~3 min + 128 steps ~1.5 min); 5m never fired
