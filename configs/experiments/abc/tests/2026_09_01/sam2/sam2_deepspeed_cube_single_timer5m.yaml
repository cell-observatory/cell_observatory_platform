# @package _global_
# Feature: wall-clock checkpoint trigger every 5 min (deepspeed path saves directly in before_step); more rows so the run outlives the interval.
defaults:
  - base_sam2_deepspeed
  - _self_

experiment_name: sam2_abc_deepspeed_single_cube_128_timer5m

datasets:
  max_rows: 1024

hooks:
  hooks_list:
  - name: free_device_buffer
  - name: lr_scheduler
    backend: DEEPSPEED
  - name: iteration_timer
  - name: periodic_writer
  - name: periodic_checkpointer
    file_prefix: latest_model
    backend: DEEPSPEED
    time_interval: 5m
