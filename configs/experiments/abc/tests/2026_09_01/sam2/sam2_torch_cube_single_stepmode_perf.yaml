# @package _global_
# Feature: step-based iteration (max_steps, step checkpoint cadence) + perf metrics (tps/tflops/MFU, per-step sync) + torch memory stats hook.
defaults:
  - base_sam2_torch
  - _self_

experiment_name: sam2_abc_torch_single_cube_128_stepmode_perf

trainer_loop:
  iteration_mode: step
  max_steps: 32
  val_every_n_steps: null
  checkpoint_save_period: 16 # optimizer steps
  checkpoint_every_n_epochs: null
  with_perf_metrics: true

hooks:
  hooks_list:
  - name: free_device_buffer
  - name: lr_scheduler
    backend: TORCHTITAN
  - name: iteration_timer
  - name: periodic_writer
  - name: periodic_checkpointer
    file_prefix: latest_model
    backend: TORCHTITAN
    time_interval: 3h30m
  - name: torch_memory_stats
    step_period: 1
    epoch_period: 1
    logdir: ${loggers.logdir}
