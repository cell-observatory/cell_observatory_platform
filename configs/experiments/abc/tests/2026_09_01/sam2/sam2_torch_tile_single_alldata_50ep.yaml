# @package _global_
# SAM2 finetune, TILE mode, all uniform-shape synthetic data, 50 epochs --
# ViT-L single-scale, torch-native (FSDP2, DCP). Self-contained copy of
# base_sam2_torch with the tile-mode block from sam2_torch_tile_single and the
# settings from the 2026-09-01 ABC sanity runs / max_masks probes:
#   * max_masks 10 per sample at 128x384x1024 (probe: 8 -> 57.5 GiB max active,
#     90-100 % util during steps; 16 and 32 OOM on the A100-80GB);
#   * databases.max_tile_shape [128, 512, 3328] keeps every annotated synthetic
#     tile up to that size (266 ROIs, 4550 tiles, ~60k frames) and excludes the
#     ~12 ROIs with 256- or 1536-sized tiles, so the pinned buffer max stays
#     1x128x512x3328x6 (~2.6 GB/sample) instead of 13 GB;
#   * a random 128x384x1024 window is CROPPED from each tile at native
#     resolution (Crop transform; no resize, no anisotropic squash);
#   * 5 % validation split (loss-based in-loop evaluator) + best-checkpoint hooks.
# Budget: ~60k frames / 8 per step = ~7.5k steps/epoch; the mm8 probe ran ~4 s
# per step (data + compute), i.e. ~8 h/epoch -> 50 epochs is ~2.5 weeks on this
# node. Trim with schedulers.epochs or datasets.max_rows if that is not intended.
defaults:
  - /tasks/instance_segmentation
  - /paths/local
  - /hydra/overrides
  - /datasets/databases/base_database
  - /datasets/transforms/ray_transforms
  - /datasets/preprocessor/ray_preprocessor
  - /datasets/pretrain_dataset_ray
  - /datasets/preprocessor/sam2video_preprocessor
  - /datasets/masking/mask_generator
  - /models/meta_arch/sam/base_single_scale
  - /models/backbones/masked_encoder/large
  - /models/backbones/sam_backbone/sam_backbone
  - /checkpoint/checkpoint_dcp
  - /loggers/loggers
  - /evaluation/base_evaluator
  - /parallelism/sam2
  - /trainer/torch_native_trainer
  - /optimizers/adamw_torch
  - /schedulers/warmup_cosine_decay_torch
  - /optimizations/models/sam/large
  - /optimizations/optimizations
  - /profiling/profiling
  - /clusters/local
  - _self_

experiment_name: sam2_abc_torch_single_tile_128x384x1024_alldata_50ep
wandb_project: sam2_tile

distributed_framework: ray
run_type: single_run
job_type: train
loop_per_worker_script: cell_observatory_platform.training.loops.train_loop_per_worker

quantization: bfloat16
dataset_dtype: float16
storage_dtype: uint16
dataset_layout_order: TZYXC
seed: 42

task: finetuning
network: baseline

# dgx0.abc0 node shape: 8x A100-80GB, 128 cores, ~2 TB RAM. bs_per_gpu = batch_size // 8.
clusters:
  batch_size: 8       # 1 per GPU
  worker_nodes: 1
  gpus_per_worker: 8
  cpus_per_gpu: 8
  mem_per_cpu: 31000
  ray_queue_memory: 0.2

# overrides
# --------------------------------------------------------------------------------

optimizations:
  env:
    # The launcher's apptainer exec inherits the host env and binds $HOME, so the
    # user's ~/.local site-packages shadows the image's `numa` module
    # (ImportError: cannot import name 'schedule' from 'numa'). Exported by
    # manager.py before launch; workers inherit it.
    PYTHONNOUSERSITE: "1"

trainer_loop:
  iteration_mode: epoch
  checkpoint_every_n_epochs: 1
  with_perf_metrics: false

parallelism:
  quantize:
    enable: false # A100 is SM80: float8 needs SM89+, mx needs SM100+; must stay off here

# Use the PointRend point-sampling loss path (labelmap-native).
models:
  meta_arch:
    sam:
      criterion_args:
        use_point_sampling: true
        num_points: 26000          # kept from the H200 unit (~10% of its 32x64x128
                                    # stride-4 grid); at 128^3 the grid is 32^3=32768
        low_res_multimasks: true    # focal/dice on LOW-RES stream;
                                    # dense iou_loss reads HIGH-RES forward-only

paths:
  outdir: ${paths.data_path}/sam2/${experiment_name}
  # null -> dry_lab.storage_locations.root_path from the DB
  # (synthetic: /clusterfs/vast/forsynthetic/.../synthetic_data_iteration_2, mounted on abc).
  server_path_override: null
  resume_checkpointdir: null
  pretrained_checkpointdir: null

datasets:
  batch_size: ${clusters.batch_size_per_gpu}
  # This node is used from a 16-core Slurm cpuset (cores 0-7,64-71); the per-GPU
  # NUMA bind (bind_current_process_to_node) raises when a GPU's NUMA node has
  # no CPUs in the cpuset. Pinning cannot help with 16 cores anyway.
  pin_numa_node: false
  # cod_db_20260824 materializes only shape_id 1 (1x128x128x128) cubes; the cube
  # query pins T/Z/Y/X, so other shapes return 0 rows. 5 signal + 1 mask channel.
  train_shape: [1, 128, 384, 1024, 5]
  input_shape: [1, 128, 384, 1024, 6] # post-Resize model input; patch grid 8x24x64 at 16^3
  patch_shape: [1, 16, 16, 16, null]
  mask_channel_idx: 5
  last_batch_policy: drop

  split: 0.05 # held-out validation (loss-based evaluator); best_checkpointer keys on val step_loss
  return_dataloader: true
  distributed_sampler: true
  buffer_capacity: 4 # pinned host slots per GPU; buffer max is 1x128x512x3328x6 (~2.6 GB) per slot
  num_actors_min: 4
  num_actors_max: 12

  use_cached_hypercubes_dataframe: false
  max_rows: null # all annotated frames of the ROIs below (~60k)
  # databases.max_tile_shape (below) bounds the per-axis buffer max in SQL:
  # 1x128x512x3328x6 (~2.6 GB/sample); the ~12 ROIs with 256- or 1536-sized
  # tiles (13 GB/sample buffers) are excluded.
  cdf_threshold: null
  cdf_target: null
  selected_channel_localizations: ["membrane", "cytosol"]
  has_annotations: true
  synthetic_only: true

  databases:
    dbname: local
    protocol: cursor
    verbose: true
    diagnostic_verbose: false
    sample_type: tile # api.tiles_training (ragged; only T pinned)
    max_tile_shape: [128, 512, 3328] # (Z, Y, X) upper bound per axis
    data_channel_count: 5 # SIGNAL channels only (mask excluded); 6 -> 0 rows
    required_channel_localizations: ["membrane", "cytosol"]
    storage_location: synthetic # dry_lab.storage_locations name (vast-main | abc2-main | synthetic)

  preprocessor:
    max_masks: 10 # A100-80GB at 128x384x1024: 8 -> 57.5 GiB max active; 16 OOMs
    transforms_list:
      # 1) Random 128x384x1024 window at native resolution (no resize): the
      #    collator buffer is the dataset max; the crop lands on input_shape
      #    (_assert_input_shape_spatial). Boxes are shifted/clipped/filtered
      #    with mask_ids/labels; the padding mask follows the window.
      - _target_: cell_observatory_platform.data.transforms.crop.Crop
        target_spatial_shape: [128, 384, 1024] # (Z, Y, X) == input_shape spatial
        crop_dims: YX # Z is already 128
        crop_type: random
        bbox_format: ${datasets.collate_fn.bbox_output_format}
        boxes_normalized: ${datasets.collate_fn.normalize_bboxes}
        seed: ${seed}
      # 2) Normalize after the crop (sam2video_preprocessor default).
      - _target_: cell_observatory_platform.data.transforms.normalize.Normalize
        input_layout:
          _target_: cell_observatory_platform.data.data_shapes.MULTICHANNEL_HYPERCUBE
          value: ${dataset_layout_order}

  collate_fn:
    _target_: cell_observatory_platform.data.datasets.pretrain_dataset_ray.FinetuneCollatorActor
    require_targets: true
    dtype: ${dataset_dtype}
    buffer_dtype: ${storage_dtype}
    batch_size: ${clusters.batch_size_per_gpu}
    input_shape: ${datasets.input_shape}
    input_format: ${dataset_layout_order}
    device_buffer_capacity: 2
    pin_numa_node: ${datasets.pin_numa_node}
    pin_pages: ${datasets.pin_memory}
    bbox_data_format: zyxzyx
    bbox_output_format: cxcyczwhd
    debug: false
    debug_device_idx: 0
    normalize_bboxes: true
    async_device_copy: false

schedulers:
  epochs: 50
  warmup: 2   # epochs (cosine, step-based via the torch scheduler)
  cooldown: 5

optimizers:
  wd: ${eval:'${optimizers.lr} * 0.1'}
  lr: 1e-4

hooks:
  hooks_list:
  - name: free_device_buffer
  - name: lr_scheduler
    backend: TORCHTITAN
  - name: iteration_timer
  - name: periodic_writer
  - name: periodic_checkpointer
    file_prefix: latest_model
    backend: TORCHTITAN
    # wall-clock checkpoint cadence on top of the per-epoch save (verified to
    # fire and dedup in the timer sanity run); ~8 h epochs make this the one
    # that matters if the node goes away.
    time_interval: 3h30m
  - name: best_checkpointer
    backend: TORCHTITAN
    checkpointdir: ${checkpoint.checkpoint_manager.save_checkpointdir}
  - name: best_metric_saver
    metric_name: ${evaluation.val_metric}
    compare_fn: ${evaluation.val_mode}
    eval_after_validation: true
  - name: torch_memory_stats
    step_period: 50
    epoch_period: 1
    logdir: ${loggers.logdir}
