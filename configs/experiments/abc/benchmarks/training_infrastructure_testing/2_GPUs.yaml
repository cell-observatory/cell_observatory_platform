#@package _global_
paths:
  docker_image: null
  apptainer_image: /clusterfs/nvme/hph/env_images/develop_torch_cuda_12_8.sif
  repo_path: ${oc.env:REPO_DIR}
  data_path: /clusterfs/nvme/segment_4d
  server_folder_path: /clusterfs/vast/Data/cell_observatory_training_datasets
  workdir: /workspace/${oc.env:REPO_NAME}
  ray_script: ${oc.env:REPO_DIR}/cluster/ray_local_cluster.sh
  runner_script: ${oc.env:REPO_DIR}/training/runner.py
  dotenv_path: ${oc.env:REPO_DIR}/.env
  resume_checkpointdir: null
  pretrained_checkpointdir: null
  outdir: /clusterfs/nvme/segment_4d/pretrained_models/benchmark/training_mae_4d_infrastructure/2_GPUs
clusters:
  job_name: ${experiment_name}
  launcher_type: slurm
  partition: abc_a100
  qos: abc_high
  python_env: python
  batch_size: 48
  worker_nodes: 1
  gpus_per_worker: 3
  cpus_per_gpu: 4
  mem_per_cpu: 31000
  cpus_per_worker: ${eval:'${clusters.gpus_per_worker} * ${clusters.cpus_per_gpu}'}
  mem_per_worker: ${eval:'${clusters.cpus_per_worker} * ${clusters.mem_per_cpu}'}
  total_gpus: ${eval:'${clusters.worker_nodes} * ${clusters.gpus_per_worker}'}
  total_cpus: ${eval:'${clusters.worker_nodes} * ${clusters.cpus_per_worker}'}
  batch_size_per_gpu: ${eval:'${clusters.batch_size} // ${clusters.total_gpus}'}
  cpus_for_training_coordinator: 1
  head_node_cpus: ${eval:'${clusters.cpus_per_worker} + ${clusters.cpus_for_training_coordinator}'}
  head_node_gpus: ${clusters.gpus_per_worker}
  head_node_mem: ${clusters.mem_per_worker}
  exclusive: null
  nodelist: null
  dependency: null
  constraint: null
  timelimit: null
  max_worker_heartbeat_timeout: 2
  run_config:
    log_to_file: true
    storage_path: ${paths.outdir}
    checkpoint_config:
      num_to_keep: 3
      checkpoint_score_attribute: loss
      checkpoint_score_order: min
    failure_config:
      max_failures: 0
  torch_config:
    timeout_s: 3600
  scaling_config:
    use_gpu: true
    num_workers: ${clusters.total_gpus}
    resources_per_worker:
      CPU: ${clusters.cpus_per_gpu}
      GPU: 1
    trainer_resources:
      CPU: ${clusters.cpus_for_training_coordinator}
datasets:
  databases:
    _target_: data.databases.supabase_database.SupabaseDatabase
    dbname: staging
    num_timepoints: ${datasets.input_shape.0}
    max_rois: null
    max_tiles: null
    max_hypercubes: 1000
    hpf_list: null
    roi_list: null
    tile_list: null
    verbose: true
    fetch_hypercubes_dataframe: true
    hypercubes_dataframe_path: ${paths.outdir}/database/hypercubes_dataframe.csv
    use_cached_hypercubes_dataframe: false
    protocol: cursor
  masking:
    mask_generators:
    - _target_: data.masking.mask_generator.MaskGenerator
      layout: ${datasets.dataset.input_layout}
      input_shape: ${datasets.input_shape}
      patch_shape: ${datasets.patch_shape}
      lateral_mask_scale: 0.5
      axial_mask_scale: 0.5
      temporal_mask_scale: 0.5
      aspect_ratio_scale_hw: 0.5
      random_masking_ratio: 0.75
      num_blocks: 2
      channels_to_mask: null
      time_downsample_pattern: null
      mask_mode:
        _target_: data.masking.mask_generator.MaskModes
        value: random
  transforms:
    transforms_list:
    - _target_: data.transforms.normalize.Normalize
  preprocessor:
    _target_: models.preprocessor.TorchPreprocessor
    dtype: ${dataset_dtype}
    with_masking: true
    mask_generator: ${datasets.masking.mask_generators.0}
  batch_size: ${clusters.batch_size_per_gpu}
  input_shape:
  - 32
  - 128
  - 128
  - 128
  - 2
  patch_shape:
  - 4
  - 16
  - 16
  - 16
  split: 0.1
  return_dataloader: true
  distributed_sampler: true
  collate_fn: data.datasets.pretrain_dataset.simple_collate_pretrain_dataset
  prefetch_factor: 2
  num_workers: ${clusters.cpus_per_worker}
  dataset:
    _target_: data.datasets.pretrain_dataset.PretrainDataset
    dtype: ${dataset_dtype}
    server_folder_path: ${paths.server_folder_path}
    hypercubes_dataframe_path: ${paths.outdir}/database/hypercubes_dataframe.csv
    input_layout:
      _target_: data.data_shapes.MULTICHANNEL_HYPERCUBE
      value: ${dataset_layout_order}
models:
  mae:
    _target_: models.maskedautoencoder.MaskedAutoEncoder
    input_fmt: ${dataset_layout_order}
    input_shape: ${eval:"[${clusters.batch_size_per_gpu}] + ${datasets.input_shape}"}
    temporal_patch_size: ${datasets.patch_shape.0}
    lateral_patch_size: ${datasets.patch_shape.1}
    axial_patch_size: ${datasets.patch_shape.2}
    embed_dim: 1280
    decoder_embed_dim: 512
    depth: 32
    decoder_depth: 8
    num_heads: 16
    decoder_num_heads: 8
    mlp_ratio: 4.0
    proj_drop_rate: 0.0
    att_drop_rate: 0.0
    drop_path_rate: 0.1
    init_std: 0.02
    fixed_dropout_depth: false
    use_conv_proj: false
    norm_layer: RmsNorm
    act_layer: SiLU
    mlp_layer: SwiGLU
    mask_ratio: 0.75
    window_mask_shape: null
hooks:
  hooks_list:
  - _target_: training.hooks.AnomalyDetector
  - _target_: training.hooks.SamplerSetter
  - _target_: training.hooks.LRScheduler
  - _target_: training.hooks.IterationTimer
    warmup_iter: 1
  - _target_: training.hooks.PeriodicWriter
  - _target_: training.hooks.PeriodicCheckpointer
    period: 1
    file_prefix: latest_model
  - _target_: training.hooks.BestCheckpointer
    checkpointdir: ${checkpoint.checkpoint_manager.save_checkpointdir}
  - _target_: training.hooks.TorchMemoryStats
    step_period: 2
    epoch_period: 1
    logdir: ${loggers.logdir}
  - _target_: training.hooks.BestMetricSaver
    metric_name: ${evaluation.val_metric}
    compare_fn: ${evaluation.val_mode}
    eval_after_validation: true
checkpoint:
  resume_run: false
  ray_checkpoint_config:
    num_to_keep: 3
    checkpoint_score_attribute: best_loss
    checkpoint_score_order: ${evaluation.val_mode}
  checkpoint_manager:
    _target_: training.checkpoint.CheckpointManager
    load_universal_checkpoint: ${deepspeed.checkpoint.load_universal}
    resume_checkpointdir: ${paths.resume_checkpointdir}
    pretrained_checkpointdir: ${paths.pretrained_checkpointdir}
    zero_stage: ${deepspeed.zero_optimization.stage}
    save_checkpointdir: ${paths.outdir}/checkpoints
    load_dtype: ${quantization}
    checkpoint_tag: latest_model
    engine: ${engine}
    freeze_modules: null
    state_dict_filter: null
    activation_checkpoint_modules: null
loggers:
  logdir: ${paths.outdir}/logs
  event_writers_list:
    _target_: training.loggers.EventWriterList
  event_writers:
  - _target_: training.loggers.LocalEventWriter
    save_dir: ${loggers.logdir}
    step_scalars_prefix: step_logbook
    epoch_scalars_prefix: epoch_logbook
    scalars_save_format: csv
  - _target_: training.loggers.WandBEventWriter
    project: cell_observatory_test
    dir: ${loggers.logdir}
    name: ${experiment_name}
    tags:
    - pretrain
    - mae
    - train
    - training.loops.EpochBasedTrainer
    - deepspeed
    - float16
    - pretrain_mae
    - benchmark
    - benchmark_training_infra
    - scaling
    - '17_07_2025'
    resume_from: null
    id: null
    notes: First test run for wandb logging
    force: true
    step_scalar_keys:
    - step_time
    - val_step_time
    - step_loss
    - lr
    epoch_scalar_keys:
    - epoch_time
    - step_time
    - val_time
    - val_step_time
    - val_step_loss
    - step_loss
    - lr
    - eta
  event_recorder:
    _target_: training.loggers.EventRecorder
evaluation:
  val_begin: 0
  val_interval: 1
  val_metric: val_step_loss
  val_mode: min
  evaluator:
    _target_: evaluation.base_evaluation.BaseEvaluator
    training_metrics:
    - step_loss: mean
deepspeed:
  fp16:
    enabled: true
    auto_cast: true
    loss_scale: 0
    loss_scale_window: 1000
    hysteresis: 2
    consecutive_hysteresis: true
    min_loss_scale: 1
  bf16:
    enabled: false
  zero_optimization:
    stage: 2
    reduce_bucket_size: auto
    reduce_scatter: true
    contiguous_gradients: true
    overlap_comm: true
    stage3_prefetch_bucket_size: auto
    stage3_param_persistence_threshold: auto
    stage3_max_live_parameters: 1000000000.0
    stage3_max_reuse_distance: 1000000000.0
    stage3_gather_16bit_weights_on_model_save: false
    offload_optimizer:
      device: none
    offload_param:
      device: none
  checkpoint:
    load_universal: false
  tensorboard:
    enabled: true
    output_path: ${loggers.logdir}
    job_name: ${experiment_name}
  csv_monitor:
    enabled: true
    output_path: ${loggers.logdir}
    job_name: ${experiment_name}
  flops_profiler:
    enabled: true
    profile_step: 1
    module_depth: -1
    top_modules: 1
    detailed: true
    output_file: ${loggers.logdir}/${experiment_name}/flops_profiler.log
  gradient_clipping: 0.5
  steps_per_print: 100
  gradient_accumulation_steps: 1
  train_batch_size: ${clusters.batch_size}
  zero_allow_untested_optimizer: true
optimizers:
  opt: lamb
  lr: 0.005
  wd: 0.0005
  ld: null
  clip_grad: 0.5
  betas:
  - 0.9
  - 0.99
  eps: 1.0e-08
schedulers:
  epochs: 1
  warmup: 2
  cooldown: 1
  fixedlr: false
  ema:
  - 0.998
  - 1.0
experiment_name: benchmark
task: pretrain_mae
network: mae
engine: deepspeed
distributed_framework: ray
job_type: train
trainer: training.loops.EpochBasedTrainer
loop_per_worker_script: training.loops.train_loop_per_worker
quantization: float16
dataset_dtype: float16
dataset_layout: data.data_shapes.MULTICHANNEL_4D_HYPERCUBE
dataset_layout_order: TZYXC
