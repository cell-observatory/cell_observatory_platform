# @package _global_
# Same general setup as sam2_baseline_abc_a100.yaml, adapted for Mask2Former
# (semantic segmentation, 2 classes). See models/meta_arch/mask2former.py.
# NOTE: Mask2Former trains on the semantic-segmentation data/preprocessor
# (single mask channel, occupancy-filtered), not the 6-channel instance source.
defaults:
  - /tasks/semantic_segmentation
  - /paths/local
  - /hydra/overrides
  - /clusters/abc_a100
  - /datasets/pretrain_dataset_ray
  - /datasets/preprocessor/semantic_segmentation_preprocessor
  - /models/meta_arch/mask2former/mae_large_vitdet
  - /models/backbones/masked_encoder/large
  - /models/backbones/mask2former_backbone/mask2former_backbone_w_vitdet
  - /models/adapters/vit_det
  - /models/heads/pixel_decoder/mask2former_vitdet_pixel_decoder
  - /models/heads/mask2former_decoder/mask2former_vitdet_transformer_decoder
  - /checkpoint/checkpoint
  - /loggers/loggers
  - /evaluation/base_evaluator
  - /deepspeed/zero2
  - /optimizers/lamb
  - /schedulers/warmup_cosine_decay
  - /optimizations/models/mask2former/base
  - /optimizations/optimizations
  - /profiling/profiling
  - _self_

experiment_name: mask2former_baseline_abc_a100_1node_4gpu_1epoch_val
wandb_project: testing

# debug_mode: true
backend: DEEPSPEED
distributed_framework: ray
run_type: single_run
job_type: train
trainer: cell_observatory_platform.training.loops.EpochBasedTrainer
loop_per_worker_script: cell_observatory_platform.training.loops.train_loop_per_worker

quantization: bfloat16
dataset_dtype: float16
storage_dtype: uint16
dataset_layout_order: ZYXC
seed: 42

task: finetuning
network: baseline
engine: deepspeed

# overrides
# --------------------------------------------------------------------------------

# Two semantic classes (decoder and criterion must match)
models:
  meta_arch:
    mask2former:
      num_classes: 2
      decoder_args:
        num_classes: 2
      criterion_args:
        num_classes: 2

# abc cluster: 1 A100 node, 2 GPUs total (launcher=slurm, partition=abc_a100)
clusters:
  batch_size: 4 # total batch size -> batch_size_per_gpu = 4 // 2 = 2 (raise toward ~20 if VRAM allows)
  worker_nodes: 1
  gpus_per_worker: 2
  cpus_per_gpu: 8
  mem_per_cpu: 31000
  ray_queue_memory: 0.2

paths:
  # base output directory for logs, checkpoints, etc.
  outdir: ${paths.data_path}/testing/${experiment_name}
  resume_checkpointdir: null
  pretrained_checkpointdir: null

datasets:
  batch_size: ${clusters.batch_size_per_gpu}
  train_shape: [128, 256, 512, 1]
  input_shape: [128, 256, 512, 2]
  patch_shape: [16, 16, 16, null]
  occupancy_threshold: 0.9

  split: 0.1 # 10% held out -> validation pass runs after the single epoch
  return_dataloader: true
  distributed_sampler: true
  buffer_capacity: 16
  num_actors_min: 4
  num_actors_max: 12

  max_hypercubes: 10000 # ~10k cubes (set lower for a fast smoke test)

  use_cached_hypercubes_dataframe: true
  hypercubes_dataframe_path: /clusterfs/nvme/segment_4d/databases/prepared_1_128_128_128_2_hypercube_view.csv

  databases:
    cdf_threshold: null
    occupancy_threshold_filter_type: 'min_ch0'
    synthetic_only: true
    has_annotations: true
    server_folder_path: /clusterfs/vast/forsynthetic/benchmark_tests/data/synthetic_data_iteration_1
    with_hypercubes_dataframe: true
    mask_channel_idx: 1

  collate_fn:
    _target_: cell_observatory_platform.data.datasets.pretrain_dataset_ray.FinetuneCollatorActor
    dtype: ${dataset_dtype}
    buffer_dtype: ${storage_dtype}
    batch_size: ${clusters.batch_size_per_gpu}
    input_shape: ${datasets.input_shape}
    input_format: ${dataset_layout_order}
    device_buffer_capacity: 2
    pin_numa_node: ${datasets.pin_numa_node}
    pin_pages: ${datasets.pin_memory}
    bbox_data_format: zyxzyx
    bbox_output_format: cxcyczwhd
    debug: false
    debug_device_idx: 0
    normalize_bboxes: true
    async_device_copy: false
    columns:
      - "x_start"
      - "y_start"
      - "z_start"
      - "time_start"
      - "channel_size"
      - "z_size"
      - "y_size"
      - "x_size"
      - "time_size"
      - "server_folder"
      - "output_folder"
      - "tile_name"
      - "prepared_id"
      - "annotations_metadata"

schedulers:
  epochs: 1   # one epoch -> train + validation pass
  warmup: 0   # warmup+cooldown must be <= epochs for the cosine scheduler
  cooldown: 0

optimizers:
  wd: ${eval:'${optimizers.lr} * 0.1'}
  lr: 1e-3

# hooks
hooks:
  hooks_list:
  - name: free_device_buffer
  - name: lr_scheduler
    backend: DEEPSPEED
  - name: iteration_timer
  - name: periodic_writer
  - name: periodic_checkpointer
    file_prefix: latest_model
    backend: DEEPSPEED
  - name: best_checkpointer
    checkpointdir: ${checkpoint.checkpoint_manager.save_checkpointdir}
  - name: best_metric_saver
    metric_name: ${evaluation.val_metric}
    compare_fn: ${evaluation.val_mode}
    eval_after_validation: true
