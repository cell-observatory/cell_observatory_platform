# @package _global_
defaults:
  - /paths/abc                               # configs/paths/abc.yaml
  - /hydra/overrides                         # configs/hydra/overrides.yaml (not working)
  - /clusters/local                          # configs/clusters/local.yaml
  - /datasets/pretrain_dataset_ray           # configs/datasets/pretrain_dataset_ray.yaml
  - /models/mae/large                        # configs/models/mae/large.yaml
  - /hooks/hooks                             # configs/hooks/hooks.yaml
  - /checkpoint/checkpoint                   # configs/checkpoint/checkpoint.yaml
  - /loggers/loggers                         # configs/loggers/loggers.yaml
  - /evaluation/base_evaluator               # configs/evaluation/base_evaluator.yaml
  - /deepspeed/zero2                         # configs/deepspeed/zero2.yaml
  - /optimizers/lamb                         # configs/optimizers/lamb.yaml
  - /schedulers/test_warmup_cosine_decay     # configs/schedulers/test_warmup_cosine_decay.yaml
  - /optimizations/optimizations             # configs/optimizations/optimizations.yaml
  - _self_

# experiment name (used for logging)
experiment_name: test_ray_dataset_collate_fix
wandb_project: test_ray_dataset

# task
task: pretrain_mae

# Model type
network: mae

# engine type
engine: deepspeed

# distributed framework
distributed_framework: ray

# run type
run_type: single_run # single_run, multi_run, or tune

# job type
job_type: train # train or test

# trainer type
trainer: training.loops.EpochBasedTrainer

# loop per worker script
loop_per_worker_script: training.loops.train_loop_per_worker

# training quantization
quantization: bfloat16 # data type for training, options: float32, float16

# dtype for training data
# NOTE: numpy doesn't support bfloat16, the preprocessor will cast data before we feed it to the model 
dataset_dtype: float16 # data type for loading data, options: float32, float16 

# dataset layout in the zarr files
dataset_layout_order: TZYXC

# overrides
# --------------------------------------------------------------------------------

# clusters
clusters:
  batch_size: 32 # total batch size
  worker_nodes: 1 # number of worker nodes
  gpus_per_worker: 1 # number of gpus per worker node
  cpus_per_gpu: 16 # number of cpu cores per gpu
  mem_per_cpu: 31000 # ram per cpu core
  scaling_config:
    use_gpu: true
    num_workers: ${clusters.total_gpus} # number of total workers (equals total nr. gpus normally)
    resources_per_worker:
      CPU: 0
      GPU: 1
    trainer_resources:
      CPU: 0 

#paths:
paths:
  # base output directory for logs, checkpoints, etc.
  outdir: ${paths.data_path}/pretrained_models/${experiment_name}
  resume_checkpointdir: null 
  pretrained_checkpointdir: null

# data 
datasets:
  # mainly used by other configs but determined here for ease of access
  batch_size: ${clusters.batch_size_per_gpu} # batch size = (total_batch_size * total_gpus)
  input_shape: [16, 128, 128, 128, 2] # NOTE: important that this matches database hypercube shape
  patch_shape: [4, 16, 16, 16]

  split: 0.1
  return_dataloader: true
  distributed_sampler: true

  prefetch_factor: 1 # prefetch factor for the dataloader
  num_workers: ${clusters.cpus_per_gpu}  # number of workers for the dataloader
  max_hypercubes: 4000 # maximum number of hypercubes to return


# schedulers
schedulers:
  epochs: 1

# turn on compile mode
optimizations:
  torch_compile:
    enabled: true
    mode: reduce-overhead
    dynamic: false

# drop_path in timm leads to graph break in compile
models:
  mae:
    drop_path_rate: 0.0 # no drop path rate for now

# flops profiler needs to be turned off for compile
deepspeed:
  flops_profiler:
    enabled: false # turn off flops profiler for now

# hooks
hooks:
  nsys_env:
    nsight: 
      pytorch: autograd-shapes-nvtx
      t: cuda,nvtx,cudnn,cublas,osrt
      s: cpu
      "gpu-metrics-devices": all
      capture-range: cudaProfilerApi
      capture-range-end: stop-shutdown
  hooks_list:
  - _target_: training.hooks.NsysProfilerHook
    start_iter: 20
    end_iter: 25
  - _target_: training.hooks.AnomalyDetector
  - _target_: training.hooks.LRScheduler
  - _target_: training.hooks.IterationTimer
  - _target_: training.hooks.PeriodicWriter
  - _target_: training.hooks.PeriodicCheckpointer
    period: 1
    file_prefix: latest_model
  - _target_: training.hooks.BestCheckpointer
    checkpointdir: ${checkpoint.checkpoint_manager.save_checkpointdir}
  - _target_: training.hooks.TorchMemoryStats
    step_period: 2
    epoch_period: 1
    logdir: ${loggers.logdir}
  - _target_: training.hooks.BestMetricSaver
    metric_name: ${evaluation.val_metric}
    compare_fn: ${evaluation.val_mode}
    eval_after_validation: true


# loggers
loggers:
  event_writers:
    - _target_: training.loggers.LocalEventWriter
      save_dir: ${loggers.logdir}
      step_scalars_prefix: step_logbook
      epoch_scalars_prefix: epoch_logbook
      scalars_save_format: csv
    - _target_: training.loggers.WandBEventWriter
      project: ${wandb_project}
      dir: ${loggers.logdir}
      name: ${experiment_name}
      tags: 
        - pretrain
        - ${network}
        - ${job_type}
        - ${trainer}
        - ${engine}
        - ${quantization}
        - ${task}
      resume_from: null
      id: null
      notes: "First test run for wandb logging"
      force: true
      step_scalar_keys:
        - step_time
        - val_step_time
        - data_time
        - preprocess_time
        - masking_time
        - collate_time
        - slice_time
        - val_data_time
        - val_preprocess_time
        - val_masking_time
        - val_collate_time
        - val_slice_time
        - step_loss
        - lr
      epoch_scalar_keys:
        - epoch_time
        - step_time
        - val_time
        - data_time
        - preprocess_time
        - masking_time
        - collate_time
        - slice_time
        - val_data_time
        - val_preprocess_time
        - val_masking_time
        - val_collate_time
        - val_step_time
        - val_step_loss
        - val_slice_time
        - step_loss
        - lr
        - eta