# @package _global_
defaults:
  - /tasks/semantic_segmentation             # configs/tasks/semantic_segmentation.yaml
  - /paths/abc                         # configs/paths/coreweave.yaml
  - /hydra/overrides                         # configs/hydra/overrides.yaml (not working)
  - /clusters/local                  # configs/clusters/coreweave_h100.yaml
  - /datasets/pretrain_dataset_ray           # configs/datasets/pretrain_dataset.yaml
  - /datasets/preprocessor/semantic_segmentation_preprocessor # configs/datasets/preprocessor/semantic_segmentation_preprocessor.yaml
  - /models/BUILD_mask2former                  # configs/models/BUILD_mask2former.yaml
  - /models/meta_arch/mask2former/mae_large_vitdet    # configs/models/mask2former/mae_large_vitdet.yaml
  - /models/backbones/masked_encoder/large   # configs/models/mae/large.yaml
  - /models/backbones/mask2former_backbone/mask2former_backbone_w_vitdet   # configs/models/mask2former_backbone/mask2former_backbone.yaml
  - /models/adapters/vit_det   # configs/models/adapters/vit_det.yaml
  - /models/heads/pixel_decoder/mask2former_vitdet_pixel_decoder  # configs/models/heads/pixel_decoder/mask2former_decoder.yaml
  - /models/heads/mask2former_decoder/mask2former_vitdet_transformer_decoder # configs/models/heads/mask2former_decoder/mask2former_decoder.yaml
  - /checkpoint/checkpoint                   # configs/checkpoint/checkpoint.yaml
  - /loggers/loggers                         # configs/loggers/loggers.yaml
  - /evaluation/base_evaluator               # configs/evaluation/base_evaluator.yaml
  - /deepspeed/zero2                         # configs/deepspeed/zero2.yaml
  - /optimizers/lamb                         # configs/optimizers/lamb.yaml
  - /schedulers/warmup_cosine_decay          # configs/schedulers/test_warmup_cosine_decay.yaml
  - /optimizations/models/mask2former/base                # configs/optimizations/models/mask2former/base.yaml
  - /optimizations/optimizations             # configs/optimizations/optimizations.yaml
  - /profiling/profiling                     # configs/profiling/profiling.yaml
  - /inference/inference_semantic_segmentation_mask2former               # configs/inference/inference_semantic_segmentation_mask2former.yaml
  - _self_

wandb_project: finetune_inference
# wandb_project: testing

backend: DEEPSPEED

# run type
run_type: single_run # single_run, multi_run, or tune

# job type
job_type: predict # train or test

# trainer type
trainer: cell_observatory_platform.training.loops.Inferencer

# loop per worker script
loop_per_worker_script: cell_observatory_platform.training.loops.train_loop_per_worker

# training quantization
quantization: bfloat16 # data type for training, options: float32, float16

# NOTE: numpy doesn't support bfloat16, the preprocessor will cast data before we feed it to the model
dataset_dtype: float16 # data type for loading data, options: float32, float16
storage_dtype: uint16

# dataset layout in the zarr files
dataset_layout_order: ZYXC

# seed
seed: 42

deepspeed:
  checkpoint:
    load_universal: true

inference:
  roi_tile_list:
  - [653, "000x_002y_001z.zarr"]

# clusters config for inference
clusters:
  batch_size: 1 # total batch size (batch size per gpu * total gpus)
  worker_nodes: 1 # number of worker nodes
  gpus_per_worker: 1 # number of gpus per worker node
  cpus_per_gpu: 4 # number of cpu cores per gpu
  mem_per_cpu: 31000 # ram per cpu core
  ray_queue_memory: 0.2

#paths:
paths:
  # base output directory for logs, checkpoints, etc.
  outdir: ${paths.data_path}/results/inference/${experiment_name}
  resume_checkpointdir: null
  pretrained_checkpointdir: null

# data
datasets:
  # # Preprocessor (instantiated as cfg.datasets.preprocessor)
  # preprocessor:
  #   debug_savepath: /clusterfs/nvme/martinalvarez/GitHub/scratch/semantic_preprocessor_viz/test_semantic_segmentation_preprocessor.png
  # mainly used by other configs but determined here for ease of access
  batch_size: ${clusters.batch_size_per_gpu} # batch size = (total_batch_size * total_gpus)
  train_shape: [128, 256, 512, 1]
  input_shape: [128, 256, 512, 2]
  patch_shape: [16, 16, 16, null]
  occupancy_threshold: 0.9

  split: 0.0
  return_dataloader: true
  distributed_sampler: true

  buffer_capacity: 16
  num_actors_min: 4
  num_actors_max: 12

  use_cached_hypercubes_dataframe: true
  # hypercubes_dataframe_path: ${paths.server_folder_path}/databases/prepared_1_128_128_128_2_hypercube_view.csv
  hypercubes_dataframe_path:  /clusterfs/nvme/segment_4d/databases/prepared_1_128_128_128_2_hypercube_view.csv

  databases:
    max_rois: null # maximum number of ROIs (each ROI can have dozens of tiles)
    max_tiles: null # maximum number of tiles (each tile can have thousands of hypercubes)

    roi_list: [653]
    tile_list: ["000x_002y_001z.zarr"]
    timepoint_list: [0]

    cdf_threshold: null
    occupancy_threshold_filter_type: 'min_ch0'
    synthetic_only: true
    has_annotations: true
    # server_folder_path: ${paths.server_folder_path}/synthetic
    server_folder_path: /clusterfs/vast/forsynthetic/benchmark_tests/data/synthetic_data_iteration_1
    with_hypercubes_dataframe: true
    mask_channel_idx: 1

  collate_fn:
    _target_: cell_observatory_platform.data.datasets.pretrain_dataset_ray.FinetuneCollatorActor
    dtype: ${dataset_dtype}
    buffer_dtype: ${storage_dtype}
    batch_size: ${clusters.batch_size_per_gpu}
    input_shape: ${datasets.input_shape}
    device_buffer_capacity: 2
    pin_numa_node: ${datasets.pin_numa_node}
    pin_pages: ${datasets.pin_memory}
    use_masks: true #true
    transforms_list: null
    bbox_data_format: zyxzyx
    bbox_output_format: cxcyczwhd
    debug: false
    debug_device_idx: 0
    normalize_bboxes: true
    async_device_copy: false
    columns:
      - "x_start"
      - "y_start"
      - "z_start"
      - "time_start"
      - "channel_size"
      - "z_size"
      - "y_size"
      - "x_size"
      - "time_size"
      - "server_folder"
      - "output_folder"
      - "tile_name"
      - "prepared_id"
      - "mask_bbox_dict"

# schedulers
schedulers:
  epochs: 1

# hooks
hooks:
  hooks_list:
  - _target_: cell_observatory_platform.training.hooks.FreeDeviceBufferHook
  - _target_: cell_observatory_platform.training.hooks.LRScheduler
    backend: DEEPSPEED
  - _target_: cell_observatory_platform.training.hooks.IterationTimer
  - _target_: cell_observatory_platform.training.hooks.PeriodicWriter
