# @package _global_
defaults:
  - ../base_experiments/instance_segmentation_maskDINO_lr_0p001
  # NOTE: We are using the MAE config but no pretrained backbone => just a ViT backbone
TODO: What configs do we use here?
  - /models/meta_arch/maskdino/mae_large_w_masks_adapter    # configs/models/maskdino/large.yaml
  - /models/backbones/masked_encoder/large   # configs/models/mae/large.yaml
  - /optimizations/models/maskdino/mae_large # configs/optimizations/models/mae.yaml
  - /models/backbones/maskdino_backbone/maskdino_backbone_w_vitdet   # configs/models/backbones/maskdino_backbone/maskdino_backbone_w_vitdet.yaml
  - /models/adapters/vit_det   # configs/models/adapters/vit_det.yaml
  - _self_

# WandB Naming Stuff
experiment_name: instance_segmentation_maskDINO_vit_large_msda_stride_16

paths:
  pretrained_checkpointdir: TODO

models:
  adapters:
    scale_factors: [1.0] # patch is 16x16x16, so 1x sampling to stride 16

  heads:
    pixel_decoder:
      use_deform_attention: true # Use MSDA
      input_shape_metadata: # Only use stride 16 feature  
        "3":
          channels: ${models.adapters.out_channels}
          stride: 16
      transformer_in_features: ["3"]
      total_num_feature_levels: 1
    maskdino_decoder:
      use_deform_attention: true
      total_num_feature_levels: 1
