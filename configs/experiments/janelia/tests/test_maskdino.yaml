# @package _global_
defaults:
  - /tasks/instance_segmentation             # configs/tasks/instance_segmentation.yaml
  - /paths/local                         # configs/paths/local.yaml
  - /hydra/overrides                         # configs/hydra/overrides.yaml (not working)
  - /clusters/janelia_a100                 # configs/clusters/janelia_a100.yaml
  - /datasets/databases/base_database        # Loads configs/datasets/databases/base_database.yaml
  - /datasets/transforms/ray_transforms      # Loads configs/datasets/transforms/ray_transforms.yaml
  - /datasets/preprocessor/ray_preprocessor  # Loads configs/datasets/preprocessor/ray_preprocessor.yaml
  - /datasets/pretrain_dataset_ray           # configs/datasets/pretrain_dataset.yaml
  - /datasets/preprocessor/instance_segmentation_preprocessor # configs/datasets/preprocessor/instance_segmentation_preprocessor.yaml
  - /datasets/masking/mask_generator         # configs/datasets/masking/mask_generator.yaml
  - /models/BUILD_maskDINO                   # configs/models/BUILD_maskdino.yaml
  - /models/meta_arch/maskdino/mae_large    # configs/models/maskdino/large.yaml
  - /models/heads/maskdino_decoder/maskdino_decoder           # configs/models/heads/maskdino_decoder/maskdino_decoder.yaml
  - /models/heads/pixel_decoder/maskdino_encoder # configs/models/heads/maskdino_encoder/maskdino_encoder.yaml
  - /models/adapters/vit_adapter             # configs/models/adapters/vit_adapter.yaml
  - /models/backbones/masked_encoder/large   # configs/models/mae/large.yaml
  - /models/backbones/maskdino_backbone/maskdino_backbone   # configs/models/backbones/maskdino_backbone/maskdino_backbone.yaml
  - /checkpoint/checkpoint                   # configs/checkpoint/checkpoint.yaml
  - /loggers/loggers                         # configs/loggers/loggers.yaml
  - /evaluation/base_evaluator               # configs/evaluation/base_evaluator.yaml
  - /deepspeed/zero2                         # configs/deepspeed/zero2.yaml
  - /optimizers/lamb                         # configs/optimizers/lamb.yaml
  - /schedulers/warmup_cosine_decay          # configs/schedulers/test_warmup_cosine_decay.yaml
  - /optimizations/models/maskdino/mae_large  # configs/optimizations/models/maskdino/mae_large.yaml
  - /optimizations/optimizations             # configs/optimizations/optimizations.yaml
  - /profiling/profiling                     # configs/profiling/profiling.yaml
  - _self_

experiment_name: instance_segmentation_maskdino_baseline_128x384x512_10_epoch_lr_0p0001_opt_lamb
wandb_project: testing

# debug_mode: true
backend: DEEPSPEED
distributed_framework: ray
run_type: single_run # single_run, multi_run, or tune
job_type: train # train or test
trainer: cell_observatory_platform.training.loops.EpochBasedTrainer
loop_per_worker_script: cell_observatory_platform.training.loops.train_loop_per_worker

quantization: bfloat16 # data type for training, options: float32, float16
# NOTE: numpy doesn't support bfloat16, the preprocessor will cast data before we feed it to the model
dataset_dtype: float16 # data type for loading data, options: float32, float16
storage_dtype: uint16
dataset_layout_order: ZYXC
seed: 42

task: finetuning
network: baseline
engine: deepspeed

# overrides
# --------------------------------------------------------------------------------

clusters:
  batch_size: 192 # total batch size
  worker_nodes: 4 # number of worker nodes
  # partition: gpu_a100 # 4 gpus per node: max 12 cpus per gpu
  # gpus_per_worker: 4 # number of gpus per worker node
  # cpus_per_gpu: 12 # number of cpu cores per gpu
  # mem_per_cpu: 15000 # ram per cpu core
  # ray_queue_memory: 0.35

paths:
  # base output directory for logs, checkpoints, etc.
  outdir: ${paths.data_path}/testing/${experiment_name}
  server_path_override: /groups/betzig/betziglab/CellObservatoryData/synthetic_data/05052026_mem_cyto_1k_volumes_77_tiles/
  resume_checkpointdir: null
  pretrained_checkpointdir: null

# data
datasets:
  # mainly used by other configs but determined here for ease of access
  batch_size: ${clusters.batch_size_per_gpu} # batch size = (total_batch_size * total_gpus)
  train_shape: [128, 384, 512, 5]
  input_shape: [128, 384, 512, 6]
  train_shape: [128, 384, 512, 5]
  input_shape: [128, 384, 512, 6]
  patch_shape: [16, 16, 16, null]
  mask_channel_idx: 5
  last_batch_policy: drop

  split: 0.0
  return_dataloader: true
  distributed_sampler: true

  buffer_capacity: 16
  num_actors_min: 4
  num_actors_max: 12

  use_cached_hypercubes_dataframe: false
  # tile_list:
    # - "000x_005y_001z.zarr"
    # - "000x_005y_000z.zarr"
  # roi_list: [314] 
  # timepoint_list: [0]
  max_rows: null # maximum number of rows to query from the database
  cdf_threshold: null
  cdf_target: null
  selected_channel_localizations: ["membrane", "cytosol"]
  has_annotations: true
  synthetic_only: true

  databases:
    dbname: local
    protocol: cursor
    verbose: true
    diagnostic_verbose: true
    sample_type: cube
    channel_count: 6
    # required_channel_key_patterns: {0: "membrane"}
    required_channel_localizations: ["membrane", "cytosol"]
    required_locations: ["exists_abc"]

  collate_fn:
    _target_: cell_observatory_platform.data.datasets.pretrain_dataset_ray.FinetuneCollatorActor
    require_targets: true
    dtype: ${dataset_dtype}
    buffer_dtype: ${storage_dtype}
    batch_size: ${clusters.batch_size_per_gpu}
    input_shape: ${datasets.input_shape}
    device_buffer_capacity: 2
    pin_numa_node: ${datasets.pin_numa_node}
    pin_pages: ${datasets.pin_memory}
    use_masks: true
    transforms_list: null
    bbox_data_format: zyxzyx
    bbox_output_format: cxcyczwhd
    mask_channel_idx: ${datasets.mask_channel_idx}
    debug: false
    debug_device_idx: 0
    normalize_bboxes: true
    async_device_copy: false
    columns:
      - "x_start"
      - "y_start"
      - "z_start"
      - "time_start"
      - "channel_size"
      - "z_size"
      - "y_size"
      - "x_size"
      - "time_size"
      - "server_folder"
      - "output_folder"
      - "tile_name"
      - "prepared_id"
      - "channel_mapping"
      - "annotations_metadata"

schedulers:
  epochs: 1

optimizers:
  wd: ${eval:'${optimizers.lr} * 0.1'}
  lr: 1e-4

# hooks
hooks:
  hooks_list:
  - _target_: cell_observatory_platform.training.hooks.FreeDeviceBufferHook
  - _target_: cell_observatory_platform.training.hooks.LRScheduler
    backend: DEEPSPEED
  - _target_: cell_observatory_platform.training.hooks.IterationTimer
  - _target_: cell_observatory_platform.training.hooks.PeriodicWriter
  # - _target_: cell_observatory_platform.training.hooks.PeriodicCheckpointer
  #   file_prefix: latest_model
  #   backend: DEEPSPEED
  # - _target_: cell_observatory_platform.training.hooks.BestCheckpointer
  #   checkpointdir: ${checkpoint.checkpoint_manager.save_checkpointdir}
  # - _target_: cell_observatory_platform.training.hooks.BestMetricSaver
  #   metric_name: ${evaluation.val_metric}
  #   compare_fn: ${evaluation.val_mode}
  #   eval_after_validation: true