# @package _global_
# Stage 0a A4. tile-crop 128x384x512 bs ladder at mm 100 -> BS_CROP
# Local mode runs the points sequentially; outdirs: <local_base outdir>/A4/<name>_sweep_<key>_<value>
run_type: multi_run
data_base_dir: A4
wandb_tags: ["sam2_study", "bench", "stage0a", "A4"]

sweep:
  - clusters: {batch_size: [16, 32]}                 # 2, 4 per GPU
runs:
  - cfg: experiments/janelia/tests/2026_09_02/sam2/stage0a/shapes/crop_128x384x512.yaml
    name: crop384x512_mm100.yaml
    overrides:
      datasets:
        preprocessor: {max_masks: 100}
        buffer_capacity: 8              # > bs/GPU slots in flight
