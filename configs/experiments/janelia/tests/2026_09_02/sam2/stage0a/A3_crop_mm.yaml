# @package _global_
# Stage 0a A3. tile-crop 128x384x512 bs 1, mask cap 46 -> 100
# Local mode runs the points sequentially; outdirs: <local_base outdir>/A3/<name>_sweep_<key>_<value>
run_type: multi_run
data_base_dir: A3
wandb_tags: ["sam2_study", "bench", "stage0a", "A3"]

sweep:
  - datasets: {preprocessor: {max_masks: [46, 100]}}
runs:
  - cfg: experiments/janelia/tests/2026_09_02/sam2/stage0a/shapes/crop_128x384x512.yaml
    name: crop384x512_bs1.yaml
    overrides:
      clusters: {batch_size: 8}
