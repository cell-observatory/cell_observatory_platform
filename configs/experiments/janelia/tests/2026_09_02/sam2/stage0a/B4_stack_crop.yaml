# @package _global_
# Stage 0a B4: every lever that won in B1-B3, together, on the crop-512 max point (2x bs if act-ckpt won).
# Flip each enable to the B-row result before launching. This row is the production candidate.
defaults:
  - /experiments/janelia/tests/2026_09_02/sam2/stage0a/shapes/crop_128x384x512
  - _self_

experiment_name: B4_stack_crop

clusters:
  batch_size: 16              # TODO(T1): 8 x BS_CROP (x2 if act-ckpt won)

datasets:
  buffer_capacity: 8
  preprocessor:
    max_masks: 100

trainer_loop:
  max_steps: 200

optimizations:
  models:
    sam:
      torch_compile:
        enable: true          # TODO(B1)
      activation_checkpoint:
        enable: false         # TODO(B2)

models:
  meta_arch:
    sam:
      use_act_ckpt_iterative_pt_sampling: false   # TODO(B2 acdec)

parallelism:
  quantize:
    enable: false             # TODO(B3)
    backend: mx
    recipe: mxfp8_cublas
    filter_fqns: []
