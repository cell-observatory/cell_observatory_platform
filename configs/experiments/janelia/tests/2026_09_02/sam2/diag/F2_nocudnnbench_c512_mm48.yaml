# @package _global_
# Diag F2: F1 + cudnn.benchmark off (H7: the decoder batch dim = batch-local mask count varies per step, so benchmark re-tunes the 3D convs). K1 setup (cube 128x384x512, bs 1/GPU, mm 48) with every timer on, 12 steps, clean finish
# so the logbook flushes: perf fwd/bwd/step, iteration timer data/preprocess/transform, memory per step.
defaults:
  - /experiments/janelia/tests/2026_09_02/sam2/stage0c/cube_128x384x512
  - _self_

experiment_name: F2_nocudnnbench_c512_mm48

paths:
  outdir: ${paths.data_path}/sam2_study/diag/${experiment_name}

clusters:
  batch_size: 8

datasets:
  max_rows: 256
  databases:
    diagnostic_verbose: true  # reports how many fringe cubes in_bounds_only dropped

trainer_loop:
  max_steps: 12
  with_perf_metrics: true

hooks:
  hooks_list:
  - name: free_device_buffer
  - name: lr_scheduler
    backend: TORCHTITAN
  - name: iteration_timer
  - name: periodic_writer
  - name: torch_memory_stats
    step_period: 1
    epoch_period: 1
    logdir: ${loggers.logdir}

optimizations:
  cudnn_benchmark: false
