# @package _global_
# P5c: rounds 1 at bs 4 (VRAM refill after the rounds cut; speed vs batch at low rounds).
# choice itself is a Step-2 quality decision.
defaults:
  - /experiments/janelia/tests/2026_09_02/sam2/stage0c/cube_128x384x512
  - _self_

experiment_name: P5c_rounds1_bs4_c512

