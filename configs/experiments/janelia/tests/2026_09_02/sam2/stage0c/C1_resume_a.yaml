# @package _global_
# Stage 0c C1a: DCP save at steps 20 and 40 on the production point (c512 bs 2 mm 48). C1b resumes from step-20.
defaults:
  - /experiments/janelia/tests/2026_09_02/sam2/stage0c/cube_128x384x512
  - _self_

experiment_name: C1_resume_a

clusters:
  batch_size: 16

trainer_loop:
  max_steps: 40
  checkpoint_save_period: 20

hooks:
  hooks_list:
  - name: free_device_buffer
  - name: lr_scheduler
    backend: TORCHTITAN
  - name: iteration_timer
  - name: periodic_writer
  - name: periodic_checkpointer
    file_prefix: latest_model
    backend: TORCHTITAN
  - name: torch_memory_stats
    step_period: 10
    epoch_period: 1
    logdir: ${loggers.logdir}
