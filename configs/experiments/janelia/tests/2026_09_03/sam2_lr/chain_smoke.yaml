# @package _global_
# Live test of the LSF job chain (docs/analysis/2026-09-03-lsf-chaining-sketch.md, test plan step 2), one short slot:
# the recipe on 8192 rows (128 steps/epoch ~ 3.6 min), 4 epochs, 20 min limit -> job 1 is killed mid-run after saving
# at 5-min intervals, job 2 resumes and finishes (TRAINING_DONE), job 3 exits in seconds. Expect in bjobs: one RUN + one
# PEND; afterwards <outdir>/chain_last_exit and TRAINING_DONE. chain_min_runtime is lowered because the whole job is
# shorter than the 20-min production crash guard.
#   python manager.py --config-name=experiments/janelia/tests/2026_09_03/sam2_lr/chain_smoke.yaml
defaults:
  - /experiments/janelia/tests/2026_09_03/sam2_lr/lr_base
  - _self_

experiment_name: chain_smoke
paths:
  outdir: ${paths.data_path}/sam2_study/01_lr/${experiment_name}

clusters:
  timelimit: 00:20
  chain_jobs: 3
  chain_min_runtime: 300

datasets:
  max_rows: 8192
  timepoint_list: [0]

schedulers:
  epochs: 4
  warmup: 1

hooks:
  hooks_list:
  - name: free_device_buffer
  - name: lr_scheduler
    backend: TORCHTITAN
  - name: iteration_timer
  - name: periodic_writer
  - name: periodic_checkpointer
    file_prefix: latest_model
    backend: TORCHTITAN
    time_interval: 5m
  - name: best_checkpointer
    checkpointdir: ${checkpoint.checkpoint_manager.save_checkpointdir}
  - name: best_metric_saver
    metric_name: ${evaluation.val_metric}
    compare_fn: ${evaluation.val_mode}
    eval_after_validation: true
