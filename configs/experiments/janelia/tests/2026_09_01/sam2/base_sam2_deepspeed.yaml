# @package _global_
# 2026-09-01 B300 bring-up: SAM2 finetuning base -- DEEPSPEED backend
# (EpochBasedTrainer: ZeRO-2, DeepSpeed checkpoints). Backend-comparison twin
# of base_sam2_torch.yaml: identical data/model/optimizer/schedule, only the
# trainer/parallelism/checkpoint groups and hook backends differ.
#
# NOTE: /clusters/janelia_b300 is listed LAST (before _self_) and the
# clusters.* overrides live in _self_, so they apply AFTER the cluster file
# resets batch_size/worker_nodes. Swap to /clusters/local to run inside an
# interactive allocation on the node.
#
# Variants override ONLY clusters.batch_size, datasets.preprocessor.max_masks,
# and optimizers.lr on top of this base.
defaults:
  - /tasks/instance_segmentation
  - /paths/local
  - /hydra/overrides
  - /datasets/databases/base_database
  - /datasets/transforms/ray_transforms
  - /datasets/preprocessor/ray_preprocessor
  - /datasets/pretrain_dataset_ray
  - /datasets/preprocessor/sam2video_preprocessor
  - /datasets/masking/mask_generator
  - /models/meta_arch/sam/base_single_scale
  - /models/backbones/masked_encoder/large
  - /models/backbones/sam_backbone/sam_backbone
  - /checkpoint/checkpoint
  - /loggers/loggers
  - /evaluation/base_evaluator
  - /deepspeed/zero2
  - /optimizers/adamw_torch
  - /schedulers/warmup_cosine_decay
  - /optimizations/models/sam/large
  - /optimizations/optimizations
  - /profiling/profiling
  - /clusters/janelia_b300
  - _self_

experiment_name: sam2_b300_deepspeed_bringup_128x384x512
wandb_project: testing

backend: DEEPSPEED
distributed_framework: ray
run_type: single_run
job_type: train
trainer: cell_observatory_platform.training.loops.EpochBasedTrainer
loop_per_worker_script: cell_observatory_platform.training.loops.train_loop_per_worker

quantization: bfloat16
dataset_dtype: float16
storage_dtype: uint16
dataset_layout_order: TZYXC
seed: 42

task: finetuning
network: baseline
engine: deepspeed

# node shape for the live b300 node (192 cpus, ~4 TB RAM, 8x B300 ~275 GB HBM).
# bs_per_gpu = batch_size // 8.
clusters:
  batch_size: 8       # 1 per GPU (proven H200 unit ported to B300)
  worker_nodes: 1
  gpus_per_worker: 8
  cpus_per_gpu: 12
  mem_per_cpu: 16000
  ray_queue_memory: 0.35

# overrides
# --------------------------------------------------------------------------------

# Use the PointRend point-sampling loss path (labelmap-native).
models:
  meta_arch:
    sam:
      criterion_args:
        use_point_sampling: true
        num_points: 26000          # kept from the H200 unit (~10% of its 32x64x128
                                    # stride-4 grid); at 128^3 the grid is 32^3=32768
        low_res_multimasks: true    # focal/dice on LOW-RES stream;
                                    # dense iou_loss reads HIGH-RES forward-only

paths:
  outdir: ${paths.data_path}/testing/${experiment_name}
  # On Janelia set it to the local mirror of that root.
  server_path_override: null
  resume_checkpointdir: null
  pretrained_checkpointdir: null

datasets:
  batch_size: ${clusters.batch_size_per_gpu}
  # cod_db_20260824: api.cube_training is a view over the shape-partitioned
  # dry_lab.synthetic_cubes/prepared_cubes tables and only shape_id 1
  # (1x128x128x128) is materialized, so the cube query (which pins T/Z/Y/X)
  # returns 0 rows for the H200 unit's 128x384x512 until that shape is cut
  # DB-side. 5 signal channels + 1 mask.
  train_shape: [1, 128, 128, 128, 5]
  input_shape: [1, 128, 128, 128, 6]
  patch_shape: [1, 16, 16, 16, null]
  mask_channel_idx: 5
  last_batch_policy: drop

  split: 0.0
  return_dataloader: true
  distributed_sampler: true
  buffer_capacity: 16
  num_actors_min: 4
  num_actors_max: 12

  use_cached_hypercubes_dataframe: false
  max_rows: 128 # bring-up probe: 128 cubes -> 16 steps/epoch at 8 per step
  cdf_threshold: null
  cdf_target: null
  selected_channel_localizations: ["membrane", "cytosol"]
  has_annotations: true
  synthetic_only: true

  preprocessor:
    max_masks: 46

  databases:
    dbname: local
    protocol: cursor
    verbose: true
    diagnostic_verbose: false
    sample_type: cube
    data_channel_count: 5 # SIGNAL channels only (mask excluded); 6 -> 0 rows
    required_channel_localizations: ["membrane", "cytosol"]
    storage_location: synthetic # dry_lab.storage_locations name in cod_db_20260824 (vast-main | abc2-main | synthetic)

  collate_fn:
    _target_: cell_observatory_platform.data.datasets.pretrain_dataset_ray.FinetuneCollatorActor
    require_targets: true
    dtype: ${dataset_dtype}
    buffer_dtype: ${storage_dtype}
    batch_size: ${clusters.batch_size_per_gpu}
    input_shape: ${datasets.input_shape}
    input_format: ${dataset_layout_order}
    device_buffer_capacity: 2
    pin_numa_node: ${datasets.pin_numa_node}
    pin_pages: ${datasets.pin_memory}
    bbox_data_format: zyxzyx
    bbox_output_format: cxcyczwhd
    debug: false
    debug_device_idx: 0
    normalize_bboxes: true
    async_device_copy: false

schedulers:
  # Testing config: 1 epoch only (bug-flush + memory/throughput probe).
  epochs: 1
  # group defaults are warmup=30/cooldown=15 (sized for 300-epoch runs); with
  # 1 epoch they'd swallow the whole run in warmup. 0/0 -> the full epoch runs
  # at/near peak LR, so the LR sweep actually differentiates.
  warmup: 0
  cooldown: 0

optimizers:
  wd: ${eval:'${optimizers.lr} * 0.1'}
  lr: 1e-4

hooks:
  hooks_list:
  - name: free_device_buffer
  - name: lr_scheduler
    backend: DEEPSPEED
  - name: iteration_timer
  - name: periodic_writer
  - name: periodic_checkpointer
    file_prefix: latest_model
    backend: DEEPSPEED
    # 4h guardrail (clusters.timelimit is 04:00 on the b300 queue): checkpoint
    # ~30 min before the limit. The hook clock starts at trainer construction,
    # so container + Ray start-up time is NOT counted; 3h30m leaves margin.
    time_interval: 3h30m
