# @package _global_
defaults:
  - /paths/janelia
  - /hydra/overrides
  - /clusters/local
  - /datasets/databases/base_database
  - /datasets/preprocessor/ray_preprocessor
  - /datasets/pretrain_dataset_ray
  - /datasets/masking/mask_generator
  - /models/meta_arch/mae/large_hiera_da
  - /checkpoint/checkpoint
  - /loggers/loggers
  - /evaluation/base_evaluator
  - /deepspeed/zero2
  - /optimizers/adamw_torch
  - /schedulers/warmup_cosine_decay
  - /optimizations/models/mae/large_hiera
  - /optimizations/optimizations
  - /profiling/profiling
  - _self_

experiment_name: test_pretrain_mae_hiera_da
wandb_project: testing

backend: DEEPSPEED
distributed_framework: ray
run_type: single_run
job_type: train
trainer: cell_observatory_platform.training.loops.EpochBasedTrainer
loop_per_worker_script: cell_observatory_platform.training.loops.train_loop_per_worker

quantization: bfloat16
dataset_dtype: float16
storage_dtype: uint16
dataset_layout_order: ZYXC
seed: 42

clusters:
  batch_size: 40
  worker_nodes: 1
  gpus_per_worker: 1
  cpus_per_gpu: 12
  mem_per_cpu: 40000
  ray_queue_memory: 0.2

paths:
  outdir: ${paths.data_path}/pretrained_models/${experiment_name}
  resume_checkpointdir: null
  pretrained_checkpointdir: null

datasets:
  batch_size: ${clusters.batch_size_per_gpu}
  input_shape: [128, 256, 256, 2]
  train_shape: [128, 256, 256, 2]
  patch_shape: [8, 8, 8, null]

  occupancy_threshold: 0.9
  split: 0.1

  return_dataloader: true
  distributed_sampler: true

  buffer_capacity: 16
  num_actors_min: 4
  num_actors_max: 12

  # max_hypercubes: 1500
  max_hypercubes: 500

  use_cached_hypercubes_dataframe: true
  hypercubes_dataframe_path: ${paths.server_folder_path}/databases/prepared_1_128_128_128_2_hypercube_view.csv

  databases:
    occupancy_threshold_filter_type: 'min_ch0'
    cdf_target: 90
    cdf_threshold: 150
    synthetic_only: false
    has_annotations: false
    with_hypercubes_dataframe: true
    mask_channel: null
    
  columns: [ 'x_start', 'y_start', 'z_start', 'time_start',
        'channel_size', 'z_size', 'y_size', 'x_size', 'time_size',
        'server_folder', 'output_folder',
        'tile_name', 'prepared_id' ]

  masking:
    mask_generators:
      - _target_: cell_observatory_platform.data.masking.mask_generator.MaskGenerator
        layout: ${datasets.dataset.input_layout}
        input_shape: ${datasets.input_shape}
        patch_shape: ${datasets.patch_shape}
        input_format: ${dataset_layout_order}
        mask_mode:
          _target_: cell_observatory_platform.data.masking.mask_generator.MaskModes
          value: "hiera_mu"
        mask_unit_size: [1, 8, 8, 8]
        random_masking_ratio: 0.75

# models:
#   meta_arch:
#     mae:
#       with_auxiliary_loss: true
#       loss_fn:
#         loss_type: "fourier_loss"
#         alpha: 0.001
#         fft_loss: "l1_masked"
#         spatial_loss: "l2_masked"
#         input_fmt: ${dataset_layout_order}
#         input_shape: ${datasets.input_shape}
#         patch_shape: ${datasets.patch_shape}
#         embed_dim: ${models.meta_arch.mae.embed_dim}

schedulers:
  epochs: 1

optimizers:
  wd: ${eval:'${optimizers.lr} * 0.1'}
  lr: 1e-3

hooks:
  hooks_list:
    - name: free_device_buffer
    - name: lr_scheduler
      backend: DEEPSPEED
    - name: iteration_timer
    - name: periodic_writer
