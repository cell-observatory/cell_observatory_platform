# @package _global_
defaults:
  - /tasks/instance_segmentation
  - /paths/janelia
  - /hydra/overrides
  - /clusters/local
  - /datasets/databases/base_database
  - /datasets/pretrain_dataset_ray
  - /datasets/preprocessor/instance_segmentation_preprocessor
  - /datasets/masking/mask_generator
  - /models/BUILD_maskDINO
  - /models/meta_arch/maskdino/mae_large
  - /models/heads/maskdino_decoder/maskdino_decoder_box_init_multiscale
  - /models/heads/pixel_decoder/maskdino_encoder_hiera_multiscale
  - /models/backbones/masked_hiera_encoder/large_multiscale
  - /models/backbones/maskdino_backbone/maskdino_backbone_hiera_multiscale
  - /checkpoint/checkpoint
  - /loggers/loggers
  - /evaluation/base_evaluator
  - /deepspeed/zero2
  - /optimizers/adamw_torch
  - /schedulers/warmup_cosine_decay
  - /optimizations/models/mae
  - /optimizations/optimizations
  - /profiling/profiling
  - _self_

experiment_name: instance_segmentation_maskdino_hiera_test
wandb_project: testing

backend: DEEPSPEED
distributed_framework: ray
run_type: single_run
job_type: train
trainer: cell_observatory_platform.training.loops.EpochBasedTrainer
loop_per_worker_script: cell_observatory_platform.training.loops.train_loop_per_worker

quantization: bfloat16
dataset_dtype: float16
storage_dtype: uint16
dataset_layout_order: ZYXC
seed: 42

clusters:
  batch_size: 1
  worker_nodes: 1
  gpus_per_worker: 1
  cpus_per_gpu: 12
  mem_per_cpu: 40000
  ray_queue_memory: 0.2

paths:
  outdir: ${paths.data_path}/pretrained_models/${experiment_name}
  resume_checkpointdir: null
  pretrained_checkpointdir: null

datasets:
  batch_size: ${clusters.batch_size_per_gpu}
  train_shape: [128, 256, 512, 1]
  input_shape: [128, 256, 512, 2]
  patch_shape: [16, 16, 16, null]

  occupancy_threshold: 0.9
  split: 0.0

  return_dataloader: true
  distributed_sampler: true
  buffer_capacity: 16
  num_actors_min: 4
  num_actors_max: 12

  max_hypercubes: 1000

  use_cached_hypercubes_dataframe: true
  hypercubes_dataframe_path: /groups/betzig/betziglab/CellObservatoryData/databases/prepared_1_128_128_128_2_hypercube_view.csv
  synthetic_only: true
  has_annotations: true
  
  databases:
    occupancy_threshold_filter_type: 'min_ch0'
    synthetic_only: true
    has_annotations: true
    server_folder_path: /groups/betzig/betziglab/CellObservatoryData/synthetic
    with_hypercubes_dataframe: true
    mask_channel: 1
  
  collate_fn:
    _target_: cell_observatory_platform.data.datasets.pretrain_dataset_ray.FinetuneCollatorActor
    dtype: ${dataset_dtype}
    buffer_dtype: ${storage_dtype}
    batch_size: ${clusters.batch_size_per_gpu}
    input_shape: ${datasets.input_shape}
    device_buffer_capacity: 2
    pin_numa_node: ${datasets.pin_numa_node}
    pin_pages: ${datasets.pin_memory}
    bbox_data_format: zyxzyx
    bbox_output_format: cxcyczwhd
    with_resize: false
    debug: false
    normalize_bboxes: true
    async_device_copy: false
    columns:
      - "x_start"
      - "y_start"
      - "z_start"
      - "time_start"
      - "channel_size"
      - "z_size"
      - "y_size"
      - "x_size"
      - "time_size"
      - "server_folder"
      - "output_folder"
      - "tile_name"
      - "prepared_id"
      - "annotations_metadata"

schedulers:
  epochs: 1

optimizers:
  wd: ${eval:'${optimizers.lr} * 0.1'}
  lr: 1e-4

hooks:
  hooks_list:
    - _target_: cell_observatory_platform.training.hooks.FreeDeviceBufferHook
    - _target_: cell_observatory_platform.training.hooks.LRScheduler
      backend: DEEPSPEED
    - _target_: cell_observatory_platform.training.hooks.IterationTimer
    - _target_: cell_observatory_platform.training.hooks.PeriodicWriter
