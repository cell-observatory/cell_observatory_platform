# @package _global_

run_type: multi_run

wandb_tags: ["hyperparameter", "sweep", "h100", "lsf", "mae", "large"]
data_base_dir: training_mae_3d

# NOTE: make sure to include .yaml suffix to naming of config files! These names are appended to configs/experiments/
#       and written to disk for reproducibility and to be passed to runner.py

# NOTE: defaults_overrides is a list of configs that will be merged into the run config
#       before applying the run overrides. This is useful for setting defaults to something different
#      than the global defaults, e.g. for a specific dataloader or model.

sweep:
  - optimizers:
      learning_rate: [1e-3, 1e-4, 5e-4]

runs:
  - cfg: benchmarks/janelia/input_size_128x256x256.yaml
    name: input_128x256x256_random_90.yaml
    defaults_overrides:
      - clusters: clusters/janelia_h100
    overrides:
      clusters:
        batch_size: 2304 # total batch size
        worker_nodes: 1 # number of worker nodes
        gpus_per_worker: 8 # number of gpus per worker node
        cpus_per_gpu: 12 # number of cpu cores per gpu
        mem_per_cpu: 40000 # ram per cpu core
        ray_queue_memory: 0.25
      datasets:
        masking:
          mask_generators:
            - mask_mode: 
                _target_: cell_observatory_platform.data.masking.mask_generator.MaskModes
                value: "random"
              random_masking_ratio: 0.9

  - cfg: benchmarks/janelia/input_size_128x256x256.yaml
    name: input_128x256x256_random_70.yaml
    defaults_overrides:
      - clusters: clusters/janelia_h100
    overrides:
      clusters:
        batch_size: 2304 # total batch size
        worker_nodes: 1 # number of worker nodes
        gpus_per_worker: 8 # number of gpus per worker node
        cpus_per_gpu: 12 # number of cpu cores per gpu
        mem_per_cpu: 40000 # ram per cpu core
        ray_queue_memory: 0.25
      datasets:
        masking:
          mask_generators:
            - mask_mode: 
                _target_: cell_observatory_platform.data.masking.mask_generator.MaskModes
                value: "random"
              random_masking_ratio: 0.7

  - cfg: benchmarks/janelia/input_size_128x256x256.yaml
    name: input_128x256x256_random_50.yaml
    defaults_overrides:
      - clusters: clusters/janelia_h100
    overrides:
      clusters:
        batch_size: 2304 # total batch size
        worker_nodes: 1 # number of worker nodes
        gpus_per_worker: 8 # number of gpus per worker node
        cpus_per_gpu: 12 # number of cpu cores per gpu
        mem_per_cpu: 40000 # ram per cpu core
        ray_queue_memory: 0.25
      datasets:
        masking:
          mask_generators:
            - mask_mode: 
                _target_: cell_observatory_platform.data.masking.mask_generator.MaskModes
                value: "random"
              random_masking_ratio: 0.5

  - cfg: benchmarks/janelia/input_size_128x256x256.yaml
    name: input_128x256x256_blocked_90.yaml
    defaults_overrides:
      - clusters: clusters/janelia_h100
    overrides:
      clusters:
        batch_size: 2304 # total batch size
        worker_nodes: 1 # number of worker nodes
        gpus_per_worker: 8 # number of gpus per worker node
        cpus_per_gpu: 12 # number of cpu cores per gpu
        mem_per_cpu: 40000 # ram per cpu core
        ray_queue_memory: 0.25
      datasets:
        masking:
          mask_generators:
            - mask_mode: 
                _target_: cell_observatory_platform.data.masking.mask_generator.MaskModes
                value: "blocked"
              lateral_mask_scale: 0.9
              axial_mask_scale: 0.9
              num_blocks: 2
              aspect_ratio_scale_hw: [0.75, 1.5]

  - cfg: benchmarks/janelia/input_size_128x256x256.yaml
    name: input_128x256x256_blocked_70.yaml
    defaults_overrides:
      - clusters: clusters/janelia_h100
    overrides:
      clusters:
        batch_size: 2304 # total batch size
        worker_nodes: 1 # number of worker nodes
        gpus_per_worker: 8 # number of gpus per worker node
        cpus_per_gpu: 12 # number of cpu cores per gpu
        mem_per_cpu: 40000 # ram per cpu core
        ray_queue_memory: 0.25
      datasets:
        mask_generators:
          - mask_mode: 
              _target_: cell_observatory_platform.data.masking.mask_generator.MaskModes
              value: "blocked"
            lateral_mask_scale: 0.75
            axial_mask_scale: 0.75
            num_blocks: 2
            aspect_ratio_scale_hw: [0.75, 1.5]

  - cfg: benchmarks/janelia/input_size_128x256x256.yaml
    name: input_128x256x256_blocked_50.yaml
    defaults_overrides:
      - clusters: clusters/janelia_h100
    overrides:
      clusters:
        batch_size: 2304 # total batch size
        worker_nodes: 1 # number of worker nodes
        gpus_per_worker: 8 # number of gpus per worker node
        cpus_per_gpu: 12 # number of cpu cores per gpu
        mem_per_cpu: 40000 # ram per cpu core
        ray_queue_memory: 0.25
      datasets:
        masking:
          mask_generators:
            - mask_mode: 
                _target_: cell_observatory_platform.data.masking.mask_generator.MaskModes
                value: "blocked"
              lateral_mask_scale: 0.65
              axial_mask_scale: 0.65
              num_blocks: 2
              aspect_ratio_scale_hw: [0.75, 1.5]