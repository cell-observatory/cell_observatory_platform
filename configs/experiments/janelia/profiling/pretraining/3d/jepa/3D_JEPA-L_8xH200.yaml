# @package _global_
defaults:
  - /paths/janelia                      
  - /hydra/overrides                    
  - /clusters/janelia_h200                       
  - /datasets/pretrain_dataset_ray      
  - /models/meta_arch/jepa/large        
  - /optimizations/optimizations        
  - /optimizations/models/jepa/large    
  - /checkpoint/checkpoint 
  - /loggers/loggers                    
  - /evaluation/base_evaluator          
  - /deepspeed/zero2                    
  - /optimizers/lamb_jepa               
  - /schedulers/test_warmup_cosine_decay   
  - /profiling/profiling
  - _self_

# experiment name (used for logging)
experiment_folder: pretraining/3d
experiment_name: 3D_JEPA-L_8xH200
wandb_project: profiling

backend: DEEPSPEED

# distributed framework
distributed_framework: ray

# run type
run_type: single_run # single_run, multi_run, or tune

# job type
job_type: train # train or test

# trainer type
trainer: cell_observatory_platform.training.loops.EpochBasedTrainer

# loop per worker script
loop_per_worker_script: cell_observatory_platform.training.loops.train_loop_per_worker

# training quantization
quantization: bfloat16 # data type for training, options: bfloat16, float32, float16

# dtype for training data
dataset_dtype: bfloat16 # data type for training, options: bfloat16, float32, float16
storage_dtype: uint16 # data type for storage

# dataset layout in the zarr files
dataset_layout_order: ZYXC

seed: 42

# overrides
# --------------------------------------------------------------------------------

clusters:
  batch_size: 1536  # (192 per h200) total batch size
  worker_nodes: 1 # number of worker nodes
  gpus_per_worker: 8 # number of gpus per worker node
  cpus_per_gpu: 12 # number of cpu cores per gpu
  mem_per_cpu: 40000 # ram per cpu core
  ray_queue_memory: 0.2

paths:
  # base output directory for logs, checkpoints, etc.
  outdir: ${paths.data_path}/pretrained_models/${experiment_folder}/${experiment_name}
  # resume_checkpointdir: ${paths.data_path}/pretrained_models/${experiment_name}/checkpoints
  resume_checkpointdir: null
  pretrained_checkpointdir: null

datasets:
  # mainly used by other configs but determined here for ease of access
  batch_size: ${clusters.batch_size_per_gpu} # batch size = (total_batch_size * total_gpus)
  input_shape: [128, 256, 256, 2]
  train_shape: [128, 256, 256, 2]
  patch_shape: [16, 16, 16, null]

  split: 0.1
  return_dataloader: true
  distributed_sampler: true

  buffer_capacity: 16
  num_actors_min: 4
  num_actors_max: 12

  max_hypercubes: 200000 #(~40% of the data is getting filtered out with out cdf threshold)

  use_cached_hypercubes_dataframe: true
  hypercubes_dataframe_path: ${paths.server_folder_path}/databases/prepared_1_128_128_128_2_hypercube_view.csv

  databases:
    occupancy_threshold_filter_type: 'min_ch0'
    cdf_target: 90
    cdf_threshold: 150
    synthetic_only: false
    has_annotations: false
    with_hypercubes_dataframe: true
    mask_channel: null

  columns: [ 'x_start', 'y_start', 'z_start', 'time_start',
          'channel_size', 'z_size', 'y_size', 'x_size', 'time_size',
          'server_folder', 'output_folder',
          'tile_name', 'prepared_id']

  preserve_order: false # only matters for TP
  callback_strategy: grpc # grpc, queue
  async_device_copy: false


  masking:
    mask_generators:
      - _target_: cell_observatory_platform.data.masking.mask_generator.MaskGenerator
        layout: ${datasets.dataset.input_layout}
        input_shape: ${datasets.input_shape}
        patch_shape: ${datasets.patch_shape}
        input_format: ${dataset_layout_order}

        lateral_mask_scale: [0.7, 0.9]
        axial_mask_scale: [0.7, 0.9]
        aspect_ratio_scale_hw: [0.75, 1.5]
        num_blocks: 2

        channels_to_mask: null
        time_downsample_pattern: null
        mask_mode: 
          _target_: cell_observatory_platform.data.masking.mask_generator.MaskModes
          value: "blocked"

models:
  meta_arch:
    jepa:
      abs_sincos_enc: true


optimizers:
  wd:  ${eval:'${optimizers.lr} * 0.1'}
  lr: 1e-3

hooks:
  hooks_list:
  - name: weight_decay_schedule
  - name: free_device_buffer
  - name: ema_scheduler
    ema_start: 0.998
    ema_end: 1.0
  - name: lr_scheduler
    backend: DEEPSPEED
  - name: iteration_timer
  - name: periodic_writer
  - name: periodic_checkpointer
    file_prefix: latest_model
    backend: DEEPSPEED
  - name: best_checkpointer
    checkpointdir: ${checkpoint.checkpoint_manager.save_checkpointdir}
  - name: best_metric_saver
    metric_name: ${evaluation.val_metric}
    compare_fn: ${evaluation.val_mode}
    eval_after_validation: true
  - name: torch_memory_stats
    step_period: 5
    epoch_period: 1
    logdir: ${loggers.logdir}
