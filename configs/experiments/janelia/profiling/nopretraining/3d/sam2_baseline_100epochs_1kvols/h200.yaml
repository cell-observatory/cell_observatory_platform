  batch_size: 24 # gpus_per_worker (8) * worker_nodes (2)
  worker_nodes: 3

datasets:
  max_rows: null
  preprocessor:
    max_masks: 50

schedulers:
  epochs: 100

optimizers:
  wd: ${eval:'${optimizers.lr} * 0.1'}
  lr: 1.33e-4