# @package _global_
#
# Cell 04: PointRend focal/dice + sampled SOFT IoU. Single flag change vs
# cell 03 (`soft_iou: false -> true`). Matches the patch's IoU formulation
# (sigmoid probabilities for the IoU target, computed under torch.no_grad()).
# Delta vs cell 03 is purely the cost of sigmoid + float-ops vs `> 0` +
# boolean-ops on the same [N,M,P] tensor -- expected to be small and dominated
# by the convergence behavior, not step time.
defaults:
  - base_sam2_iou_loss_perf
  - _self_

experiment_name: sam2_iou_ablation_a100_04_pointrend_sample_soft_iou

models:
  meta_arch:
    sam:
      criterion_args:
        use_point_sampling: true
        sample_iou: true
        soft_iou: true
        low_res_multimasks: false
