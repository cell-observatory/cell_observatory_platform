# @package _global_
#
# Cell 05: full patch-equivalent. Single flag change vs cell 04
# (`low_res_multimasks: false -> true`). Loss now reads the LOW-RES mask
# stream (`multistep_pred_multimasks`) instead of `_high_res`; the model
# still produces both streams (the memory encoder consumes the high-res one),
# but the criterion-side bwd graph no longer flows through the trilinear
# upsample. Delta vs cell 04 isolates the high-res-vs-low-res stream cost.
# If this matches the patch's ~2.3 s/step on A100, we've fully accounted
# for the regression without resurrecting any labelmap-native code path.
defaults:
  - base_sam2_iou_loss_perf
  - _self_

experiment_name: sam2_iou_ablation_a100_05_pointrend_full_patch

models:
  meta_arch:
    sam:
      criterion_args:
        use_point_sampling: true
        sample_iou: true
        soft_iou: true
        low_res_multimasks: true
