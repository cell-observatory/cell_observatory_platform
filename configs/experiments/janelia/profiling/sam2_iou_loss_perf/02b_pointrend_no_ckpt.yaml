# @package _global_
#
# Cell 02b: pointrend + dense IoU + NO criterion-side checkpointing.
# Single-flag delta vs cell 02 (`activation_checkpoint: true -> false`).
#
# Targets the sub-hypothesis flagged in the earlier analysis: cell 02 wraps
# `_step_loss_components_points` in `torch.utils.checkpoint(...)`, so the
# dense `iou_loss` forward (`flatten(2) > 0`, `&`, `|`, `sum` over the full
# `[N,M,Z,Y,X]` grid) runs TWICE per training step -- once in the original
# forward and once during the bwd recomputation. The dense iou_loss is
# forward-only cost (the `> 0` threshold breaks autograd, so the bool
# intermediates carry no gradient back into `src_masks`); the 2x
# amplification under checkpointing is the concrete mechanism by which it
# lands in the user's "bwd inner" budget.
#
# Disabling criterion checkpointing here makes that forward run ONCE.
# Expected outcome: ~half of the dense-iou_loss cost vs cell 02. If this
# cell alone closes most of the regression, then the simplest fix is "stop
# checkpointing the loss when the IoU is the cost driver" -- no IoU
# formulation change required.
#
# Memory: the bool/int intermediates of dense iou_loss have no grad through
# the threshold, so PyTorch autograd should not retain them for bwd; peak
# memory rises modestly but is not expected to OOM. The model-side
# `optimizations.activation_checkpoint.enable` flag (`/optimizations/models/
# mae/large`) is independent and remains `false`, so this cell isolates the
# loss-side wrapper exclusively.
defaults:
  - base_sam2_iou_loss_perf
  - _self_

experiment_name: sam2_iou_ablation_a100_02b_pointrend_no_ckpt

models:
  meta_arch:
    sam:
      criterion_args:
        use_point_sampling: true
        sample_iou: false
        soft_iou: false
        low_res_multimasks: false
        activation_checkpoint: false
