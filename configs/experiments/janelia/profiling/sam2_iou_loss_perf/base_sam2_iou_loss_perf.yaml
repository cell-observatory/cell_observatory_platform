# @package _global_
#
# Base config for the SAM2 IoU-loss / mask-stream perf ablation.
#
# We're tracking a ~2x step-time regression that appeared after the partial
# revert of the labelmap-native loss work (see scratch/labelmap_native_loss.patch
# and scratch/cursor_loss_computation_paths_and_mergi.md). The patch's labelmap
# path bypassed the dense `iou_loss(...)` on the full [N,M,Z,Y,X] grid in favor
# of a sampled soft-IoU target on [N,M,P]. After revert, the dense iou_loss is
# back in the hot path (and runs twice per step under activation_checkpoint).
#
# The criterion (MultiStepMultiMasksAndIousLoss) now exposes three orthogonal
# ablation flags, all defaulting off. The cells below toggle one flag at a
# time so any single-step regression cleanly attributes to one variable:
#
#   01 dense_baseline             use_point_sampling=false (legacy dense path)
#   02 pointrend                  +use_point_sampling=true        (current "slow" state)
#   02b pointrend_no_ckpt         cell 02 with activation_checkpoint=false (side-branch:
#                                 tests whether the dense iou_loss running twice under
#                                 checkpointing is the regression amplifier)
#   03 pointrend_sample_iou       +sample_iou=true                (drops dense iou_loss)
#   04 pointrend_sample_soft_iou  +soft_iou=true                  (patch's IoU formulation)
#   05 pointrend_full_patch       +low_res_multimasks=true        (full patch equivalent)
#   06 low_res_dense_iou          low_res_multimasks=true with sample_iou=false
#                                 (split-stream: focal/dice on low-res,
#                                  dense IoU on high-res; preserves dense IoU
#                                  semantics while keeping most of the cell-05
#                                  step-time win)
#
# Compute envelope: 2 epochs * 400 rows each, ~6.4k iters total per cell, so a
# full 5-cell sweep fits in a few hours on 2x A100 nodes.
#
# Variants inherit this file via `defaults: [base_sam2_iou_loss_perf, _self_]`
# and only set `experiment_name` + the four `criterion_args` flags.
defaults:
  - /tasks/instance_segmentation
  - /paths/local
  - /hydra/overrides
  - /clusters/janelia_a100
  - /datasets/databases/base_database
  - /datasets/transforms/ray_transforms
  - /datasets/preprocessor/ray_preprocessor
  - /datasets/pretrain_dataset_ray
  - /datasets/preprocessor/sam2video_preprocessor
  - /datasets/masking/mask_generator
  - /models/BUILD_SAM2
  - /models/meta_arch/sam/base_single_scale
  - /models/backbones/masked_encoder/large
  - /models/backbones/sam_backbone/sam_backbone
  - /checkpoint/checkpoint
  - /loggers/loggers
  - /evaluation/base_evaluator
  - /deepspeed/zero2
  - /optimizers/adamw_torch
  - /schedulers/warmup_cosine_decay
  - /optimizations/models/mae/large
  - /optimizations/optimizations
  - /profiling/profiling
  - _self_

# variants override
experiment_name: sam2_iou_ablation_a100_base
wandb_project: testing

backend: DEEPSPEED
distributed_framework: ray
run_type: single_run
job_type: train
trainer: cell_observatory_platform.training.loops.EpochBasedTrainer
loop_per_worker_script: cell_observatory_platform.training.loops.train_loop_per_worker

quantization: bfloat16
dataset_dtype: float16
storage_dtype: uint16
dataset_layout_order: TZYXC
seed: 42

task: finetuning
network: baseline
engine: deepspeed

# Common point-sampling sizing. No-op for cells where use_point_sampling=false.
# Variants flip the four boolean flags only.
models:
  meta_arch:
    sam:
      criterion_args:
        num_points: 26000          # ~10% of 32x64x128 stride-4 grid
        oversample_ratio: 3
        importance_sample_ratio: 0.75

clusters:
  batch_size: 8 # gpus_per_worker (4) * worker_nodes (2)
  worker_nodes: 2

paths:
  outdir: ${paths.data_path}/testing/${experiment_name}
  server_path_override: /groups/betzig/betziglab/CellObservatoryData/synthetic_data/fixed/05052026_mem_cyto_1k_volumes_77_tiles/
  resume_checkpointdir: null
  pretrained_checkpointdir: null

datasets:
  batch_size: ${clusters.batch_size_per_gpu}
  train_shape: [1, 128, 384, 512, 5]
  input_shape: [1, 128, 384, 512, 6]
  patch_shape: [1, 16, 16, 16, null]
  mask_channel_idx: 5
  last_batch_policy: drop

  split: 0.0
  return_dataloader: true
  distributed_sampler: true
  buffer_capacity: 16
  num_actors_min: 4
  num_actors_max: 12

  use_cached_hypercubes_dataframe: false
  max_rows: 400          # ablation budget; baseline (test_sam2_dist) used 1000
  cdf_threshold: null
  cdf_target: null
  selected_channel_localizations: ["membrane", "cytosol"]
  has_annotations: true
  synthetic_only: true

  preprocessor:
    max_masks: 26 # For A100 / H100

  databases:
    dbname: local
    protocol: cursor
    verbose: true
    diagnostic_verbose: true
    sample_type: cube
    channel_count: 6
    required_channel_localizations: ["membrane", "cytosol"]
    required_locations: ["exists_abc"]

  collate_fn:
    _target_: cell_observatory_platform.data.datasets.pretrain_dataset_ray.FinetuneCollatorActor
    require_targets: true
    dtype: ${dataset_dtype}
    buffer_dtype: ${storage_dtype}
    batch_size: ${clusters.batch_size_per_gpu}
    input_shape: ${datasets.input_shape}
    input_format: ${dataset_layout_order}
    device_buffer_capacity: 2
    pin_numa_node: ${datasets.pin_numa_node}
    pin_pages: ${datasets.pin_memory}
    bbox_data_format: zyxzyx
    bbox_output_format: cxcyczwhd
    debug: false
    debug_device_idx: 0
    normalize_bboxes: true
    async_device_copy: false
    columns:
      - "x_start"
      - "y_start"
      - "z_start"
      - "time_start"
      - "channel_size"
      - "z_size"
      - "y_size"
      - "x_size"
      - "time_size"
      - "server_folder"
      - "output_folder"
      - "tile_name"
      - "prepared_id"
      - "channel_mapping"
      - "annotations_metadata"

schedulers:
  epochs: 2              # short ablation cells; baseline used 10

optimizers:
  wd: ${eval:'${optimizers.lr} * 0.1'}
  lr: 1e-4

hooks:
  hooks_list:
  - _target_: cell_observatory_platform.training.hooks.FreeDeviceBufferHook
  - _target_: cell_observatory_platform.training.hooks.LRScheduler
    backend: DEEPSPEED
  - _target_: cell_observatory_platform.training.hooks.IterationTimer
  - _target_: cell_observatory_platform.training.hooks.PeriodicWriter
  - _target_: cell_observatory_platform.training.hooks.PeriodicCheckpointer
    file_prefix: latest_model
    backend: DEEPSPEED
