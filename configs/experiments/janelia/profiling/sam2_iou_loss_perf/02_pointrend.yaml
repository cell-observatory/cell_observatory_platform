# @package _global_
#
# Cell 02: PointRend focal/dice + dense hard IoU. This is the "current slow"
# configuration (the state of `test_sam2_dist.yaml` after the labelmap revert)
# and the run wandb attributes the 2x slowdown to. Together with cell 01 it
# isolates the cost of `use_point_sampling=true` flipped on while still paying
# for the dense `iou_loss` on the full [N,M,Z,Y,X] grid.
defaults:
  - base_sam2_iou_loss_perf
  - _self_

experiment_name: sam2_iou_ablation_a100_02_pointrend

models:
  meta_arch:
    sam:
      criterion_args:
        use_point_sampling: true
        sample_iou: false
        soft_iou: false
        low_res_multimasks: false
