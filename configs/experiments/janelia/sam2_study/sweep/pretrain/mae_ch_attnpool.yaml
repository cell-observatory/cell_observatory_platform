# @package _global_
# mae_vit_base + channel-adaptive patch embed (per-channel patch tokens, attn_pool fusion,
# factorized localization/fluorophore token embedding; vocab derived from api.roi_channels at startup).
# Same batch size as the base: attn_pool keeps the joint token count.
defaults:
  - mae_vit_base
  - _self_

experiment_name: mae_ch_attnpool

models:
  meta_arch:
    mae:
      patch_embed_type: channel_adaptive
      patch_embed_args:
        channel_fusion: attn_pool
        attn_pool_num_heads: 8
        channel_embed: factorized
        channel_vocab: null
        vocab_extra_slots: 16
