# @package _global_
defaults:
  - /tasks/instance_segmentation             # configs/tasks/instance_segmentation.yaml
  - /paths/coreweave                               # configs/paths/abc.yaml
  - /hydra/overrides                               # configs/hydra/overrides.yaml (not working)
  - /clusters/coreweave_h200                       # configs/clusters/local.yaml
  - /datasets/pretrain_dataset_ray           # configs/datasets/pretrain_dataset.yaml
  - /datasets/preprocessor/instance_segmentation_preprocessor # configs/datasets/preprocessor/instance_segmentation_preprocessor.yaml
  - /datasets/masking/mask_generator         # configs/datasets/masking/mask_generator.yaml
  - /models/meta_arch/plainDETR/mae_large    # configs/models/plainDETR/large.yaml
  - /models/backbones/masked_encoder/large   # configs/models/mae/large.yaml
  - /models/backbones/plain_detr_backbone/plain_detr_backbone   # configs/models/backbones/plain_detr_backbone/plain_detr_backbone.yaml
  - /models/heads/plain_detr_transformer/plain_detr_transformer # configs/models/heads/plain_detr_transformer/plain_detr_transformer.yaml
  - /checkpoint/checkpoint                   # configs/checkpoint/checkpoint.yaml
  - /loggers/loggers                         # configs/loggers/loggers.yaml
  - /evaluation/base_evaluator               # configs/evaluation/base_evaluator.yaml
  - /deepspeed/zero2                         # configs/deepspeed/zero2.yaml
  - /optimizers/lamb                         # configs/optimizers/lamb.yaml
  - /schedulers/warmup_cosine_decay          # configs/schedulers/test_warmup_cosine_decay.yaml
  - /optimizations/models/mae/large # configs/optimizations/models/mae/large.yaml
  - /optimizations/optimizations             # configs/optimizations/optimizations.yaml
  - /profiling/profiling                     # configs/profiling/profiling.yaml
  - _self_

# experiment name (used for logging)
experiment_name: instance_segmentation_plainDETR_jepa_masking_lat_0p7_op9_ax_0p7_op9_128x256x512_600_epoch_lr_0p00001_opt_lamb_no_denoise_w_aux_loss
wandb_project: finetuning_3d_v2

backend: DEEPSPEED

# run type
run_type: single_run # single_run, multi_run, or tune

# job type
job_type: train # train or test

# trainer type
trainer: cell_observatory_platform.training.loops.EpochBasedTrainer

# loop per worker script
loop_per_worker_script: cell_observatory_platform.training.loops.train_loop_per_worker

# training quantization
quantization: bfloat16 # data type for training, options: float32, float16

# NOTE: numpy doesn't support bfloat16, the preprocessor will cast data before we feed it to the model
dataset_dtype: float16 # data type for loading data, options: float32, float16
storage_dtype: uint16

# dataset layout in the zarr files
dataset_layout_order: ZYXC

# seed
seed: 42

# overrides
# --------------------------------------------------------------------------------

deepspeed:
  checkpoint:
    load_universal: true

checkpoint:
  checkpoint_manager:
    ckpt_include_prefixes: [backbone] # only load masked_encoder weights from the pretrained model
    ckpt_translate_map: {input_encoder: backbone.backbone}

# clusters
clusters:
  batch_size: 320 # total batch size (12/gpu)
  worker_nodes: 2 # number of worker nodes
  gpus_per_worker: 8 # number of gpus per worker node
  cpus_per_gpu: 12 # number of cpu cores per gpu
  mem_per_cpu: 40000 # ram per cpu core
  ray_queue_memory: 0.2

#paths:
paths:
  # base output directory for logs, checkpoints, etc.
  outdir: ${paths.data_path}/pretrained_models/${experiment_name}
  resume_checkpointdir: null
  pretrained_checkpointdir: ${paths.data_path}/pretrained_models/jepa_large_128x256x256_300_epoch_lr_0p001_mask_lat_0p7_op9_ax_0p7_op9_opt_lamb_cdf_target_80_cdf_threshold_100_h200/checkpoints

# data
datasets:
  # mainly used by other configs but determined here for ease of access
  batch_size: ${clusters.batch_size_per_gpu} # batch size = (total_batch_size * total_gpus)
  train_shape: [128, 256, 512, 1]
  input_shape: [128, 256, 512, 2]
  patch_shape: [16, 16, 16, null]
  occupancy_threshold: 0.9

  split: 0.1
  return_dataloader: true
  distributed_sampler: true

  buffer_capacity: 16
  num_actors_min: 4
  num_actors_max: 12

  # max_hypercubes: 500
  # max_hypercubes: 2000000
  # max_hypercubes: 50000
  # max_hypercubes: 1000000
  max_hypercubes: null

  use_cached_hypercubes_dataframe: true
  hypercubes_dataframe_path: ${paths.server_folder_path}/databases/prepared_1_128_128_128_2_hypercube_view.csv

  databases:
    cdf_threshold: null
    occupancy_threshold_filter_type: 'min_ch0'
    synthetic_only: true
    has_annotations: true
    server_folder_path: ${paths.server_folder_path}/synthetic
    with_hypercubes_dataframe: true
    mask_channel_idx: 1

  collate_fn:
    _target_: cell_observatory_platform.data.datasets.pretrain_dataset_ray.FinetuneCollatorActor
    dtype: ${dataset_dtype}
    buffer_dtype: ${storage_dtype}
    batch_size: ${clusters.batch_size_per_gpu}
    input_shape: ${datasets.input_shape}
    device_buffer_capacity: 2
    pin_numa_node: ${datasets.pin_numa_node}
    pin_pages: ${datasets.pin_memory}
    bbox_data_format: zyxzyx
    bbox_output_format: cxcyczwhd
    with_resize: false
    debug: false
    async_device_copy: false
    normalize_bboxes: false
    columns:
      - "x_start"
      - "y_start"
      - "z_start"
      - "time_start"
      - "channel_size"
      - "z_size"
      - "y_size"
      - "x_size"
      - "time_size"
      - "server_folder"
      - "output_folder"
      - "tile_name"
      - "prepared_id"
      - "annotations_metadata"

# schedulers
schedulers:
  epochs: 600
  warmup: 30
  cooldown: 15

optimizers:
  wd: ${eval:'${optimizers.lr} * 0.1'}
  lr: 1e-5

models:
  backbones:
    masked_encoder:
      abs_sincos_enc: false
      rope_pos_enc: true
      rope_random_rotation_per_head: true
      rope_mixed: false
      rope_theta: 100.0
  meta_arch:
    plainDETR:
      aux_loss: true

# hooks
hooks:
  hooks_list:
  - name: free_device_buffer
  - name: lr_scheduler
    backend: DEEPSPEED
  - name: iteration_timer
  - name: periodic_writer
  # - name: periodic_checkpointer
  #   file_prefix: latest_model
  #   backend: DEEPSPEED
  # - name: best_checkpointer
  #   checkpointdir: ${checkpoint.checkpoint_manager.save_checkpointdir}
  # - name: best_metric_saver
  #   metric_name: ${evaluation.val_metric}
  #   compare_fn: ${evaluation.val_mode}
  #   eval_after_validation: true
